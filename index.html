  // 会議音声のブラウザ内文字起こし（transformers.js / Whisper）。window.MeetingSTT を提供。
  import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3";
  env.allowLocalModels = false;
  window.MeetingSTT = {
    _p: null, _id: null, _loading: null,
    async load(cb, modelId) {
      modelId = modelId || "onnx-community/whisper-base";
      if (this._p && this._id === modelId) return;
      if (this._loading) { try { await this._loading; } catch (e) {} if (this._p && this._id === modelId) return; }
      this._id = modelId;
      let device = "wasm";
      try { if (navigator.gpu) device = "webgpu"; } catch (e) {}
      const opts = { progress_callback: cb };
      this._loading = (async () => {
        try { this._p = await pipeline("automatic-speech-recognition", modelId, { ...opts, device }); }
        catch (e) { this._p = await pipeline("automatic-speech-recognition", modelId, { ...opts, device: "wasm" }); }
      })();
      try { await this._loading; } finally { this._loading = null; }
    },
    async transcribe(audio, language) {
      if (!this._p) await this.load(null, this._id || "onnx-community/whisper-base");
      const out = await this._p(audio, {
        language: language || undefined, task: "transcribe",
        chunk_length_s: 8, stride_length_s: 2, return_timestamps: false,
      });
      return (out && out.text ? out.text : "").trim();
    },
  };

//  会議リアルタイムアシスタント v3（自動話者分離つき）
//  文字起こし: Web Speech API
//  話者分離: Web Audio API で声の特徴を抽出→オンライン・クラスタリング（ブラウザ内）
//  要約・議事録・翻訳: Claude API
//  ※ 話者分離は声の高さ・スペクトル特徴によるヒューリスティック近似です
// ─────────────────────────────────────────────────────────────

const C = {
  paper: "#f4f1ea", paper2: "#ebe6db", ink: "#1f1b16", inkSoft: "#5c554b",
  line: "#d8d0c1", accent: "#c8482f", accentSoft: "#e9c9bf", gold: "#9a7b3f",

const SPK = ["#c8482f", "#2f6b63", "#9a7b3f", "#4a5a8f", "#84436b", "#5f7a3a", "#b06a2c", "#3a6b8f"];
const LANGS = [
  { code: "ja-JP", label: "日本語", whisper: "japanese" }, { code: "en-US", label: "English", whisper: "english" },
  { code: "zh-CN", label: "中文", whisper: "chinese" }, { code: "ko-KR", label: "한국어", whisper: "korean" },
  { code: "es-ES", label: "Español", whisper: "spanish" }, { code: "fr-FR", label: "Français", whisper: "french" },
];
const TRANSLATE_TO = ["English", "日本語", "中文（簡体字）", "한국어", "Español", "Français", "Tiếng Việt"];

// ===== 音声特徴 & クラスタリング（純関数） =====
function autoCorrelate(buf, sr) {
  const size = buf.length;
  let rms = 0;
  for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / size);
  if (rms < 0.008) return -1;
  let r1 = 0, r2 = size - 1;
  const thr = 0.2;
  for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thr) { r1 = i; break; }
  for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thr) { r2 = size - i; break; }
  const b = buf.slice(r1, r2);
  const n = b.length;
  if (n < 64) return -1;
  const c = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) c[i] += b[j] * b[j + i];
  let d = 0;
  while (d < n - 1 && c[d] > c[d + 1]) d++;
  let maxv = -1, T0 = -1;
  for (let i = d; i < n; i++) if (c[i] > maxv) { maxv = c[i]; T0 = i; }
  if (T0 <= 0) return -1;
  const x1 = c[T0 - 1] || 0, x2 = c[T0], x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  if (a) T0 = T0 - bb / (2 * a);
  const freq = sr / T0;
  return (freq < 70 || freq > 500) ? -1 : freq;
}
// 1フレームの正規化特徴ベクトル（声がある時のみ返す）
function frameFeature(td, fd, sr, fftSize) {
  const pitch = autoCorrelate(td, sr);
  if (pitch < 0) return null; // 無声フレームは捨てる（簡易VAD）
  const bins = fd.length;
  let sum = 0, wsum = 0, low = 0, mid = 0, high = 0;
  for (let i = 1; i < bins; i++) {
    const lin = Math.pow(10, fd[i] / 20);
    const f = (i * sr) / fftSize;
    sum += lin; wsum += f * lin;
    if (f < 500) low += lin; else if (f < 2000) mid += lin; else if (f < 6000) high += lin;
  }
  const centroid = sum > 0 ? wsum / sum : 0;
  const e = low + mid + high + 1e-9;
  return [pitch / 300, centroid / 4000, low / e, mid / e, high / e];
}
function meanVec(arr) {
  const dim = arr[0].length, out = new Array(dim).fill(0);
  arr.forEach((v) => v.forEach((x, i) => (out[i] += x)));
  return out.map((x) => x / arr.length);
}
const dist = (a, b) => Math.sqrt(a.reduce((s, x, i) => s + (x - b[i]) ** 2, 0));
function kmeans(vecs, k, iters = 14) {
  const n = vecs.length, dim = vecs[0].length;
  let cents = [vecs[Math.floor(Math.random() * n)].slice()];
  while (cents.length < k) {
    const d2 = vecs.map((v) => Math.min(...cents.map((c) => dist(v, c) ** 2)));
    let sum = d2.reduce((a, b) => a + b, 0) || 1, r = Math.random() * sum, idx = 0;
    for (let i = 0; i < n; i++) { r -= d2[i]; if (r <= 0) { idx = i; break; } }
    cents.push(vecs[idx].slice());
  }
  let assign = new Array(n).fill(0);
  for (let it = 0; it < iters; it++) {
    for (let i = 0; i < n; i++) {
      let bd = Infinity, bj = 0;
      for (let j = 0; j < k; j++) { const d = dist(vecs[i], cents[j]); if (d < bd) { bd = d; bj = j; } }
      assign[i] = bj;
    }
    const sums = Array.from({ length: k }, () => new Array(dim).fill(0)), cnt = new Array(k).fill(0);
    for (let i = 0; i < n; i++) { cnt[assign[i]]++; for (let d = 0; d < dim; d++) sums[assign[i]][d] += vecs[i][d]; }
    for (let j = 0; j < k; j++) if (cnt[j]) cents[j] = sums[j].map((x) => x / cnt[j]);
  }
  return { assign };
}

const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const escHtml = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const spkName = (i) => "話者" + String.fromCharCode(65 + i); // 話者A,B,C…
const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Zoom等の文字起こしを取り込む（WEBVTT / SRT / プレーンテキストに対応）。[{t, speaker, text}] を返す。
function parseTranscript(raw) {
  const txt = (raw || "").replace(/\r/g, "");
  const out = [];
  const hms = (h, m, s) => `${String((+h) * 60 + (+m)).padStart(2, "0")}:${String(+s).padStart(2, "0")}`;
  if (/-->/.test(txt)) {
    // WEBVTT / SRT 形式（Zoomのクラウド音声トランスクリプト等）
    const lines = txt.split("\n");
    let t = "";
    const tsRe = /(\d{1,2}):(\d{2}):(\d{2})[.,]\d+\s*-->/;
    for (const line of lines) {
      const m = line.match(tsRe);
      if (m) { t = hms(m[1], m[2], m[3]); continue; }
      const s = line.trim();
      if (!s || /^WEBVTT/i.test(s) || /^NOTE/i.test(s) || /^\d+$/.test(s)) continue;
      let speaker = "", text = s;
      const v = s.match(/^<v\s+([^>]+)>([\s\S]*?)(?:<\/v>)?$/i);
      if (v) { speaker = v[1].trim(); text = v[2].trim(); }
      else { const c = s.match(/^([^:：]{1,40})[:：]\s*(.+)$/); if (c) { speaker = c[1].trim(); text = c[2].trim(); } }
      text = text.replace(/<[^>]+>/g, "").trim();
      if (text) out.push({ t, speaker, text });
    }
  } else {
    // プレーンテキスト（"話者名 HH:MM:SS" 見出し＋本文、空行区切り、または "話者名: 本文"）
    const headRe = /^(.+?)\s+(\d{1,2}:\d{2}(?::\d{2})?)\s*$/;
    for (const b of txt.split(/\n\s*\n/)) {
      const bl = b.split("\n").map((x) => x.trim()).filter(Boolean);
      if (!bl.length) continue;
      let speaker = "", t = "", start = 0;
      const h = bl[0].match(headRe);
      if (h) {
        speaker = h[1].trim();
        const p = h[2].split(":").map(Number);
        t = p.length === 3 ? hms(p[0], p[1], p[2]) : `${String(p[0]).padStart(2, "0")}:${String(p[1]).padStart(2, "0")}`;
        start = 1;
      }
      let body = bl.slice(start).join(" ").trim();
      if (!speaker) { const c = body.match(/^([^:：]{1,40})[:：]\s*(.+)$/); if (c) { speaker = c[1].trim(); body = c[2].trim(); } }
      if (body) out.push({ t, speaker, text: body });
    }
  }
  return out;
}

// float32(16k mono) を WAV Blob に変換（ローカル音声認識サーバー送信用）
const floatToWav = (samples, sampleRate) => {
  const buf = new ArrayBuffer(44 + samples.length * 2); const view = new DataView(buf);
  const w = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  w(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  w(36, "data"); view.setUint32(40, samples.length * 2, true);
  let off = 44; for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true); off += 2; }
  return new Blob([view], { type: "audio/wav" });
};
const transcribeViaServer = async (samples, sampleRate, langCode, url) => {
  const fd = new FormData();
  fd.append("file", floatToWav(samples, sampleRate), "audio.wav");
  fd.append("model", "whisper-1"); fd.append("response_format", "json");
  if (langCode) fd.append("language", langCode);
  const res = await fetch(url, { method: "POST", body: fd });
  if (!res.ok) throw new Error("server " + res.status);
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("application/json")) { const j = await res.json(); return (j.text || j.transcription || (j.results && j.results[0] && j.results[0].text) || "").trim(); }
  return (await res.text()).trim();
};
// マイタスク（会議をまたいで保持）
const TASKS_KEY = "sabotta-tasks-v1";

// ソース（NotebookLM的な参考資料）。全体＝全会議共通、会議個別＝会議IDごと。
const GSRC_KEY = "sabotta-gsources-v1", MSRC_KEY = "sabotta-msources-v1";

const loadGSrc = () => { try { const r = window.localStorage.getItem(GSRC_KEY); return r ? JSON.parse(r) : []; } catch (e) { return []; } };
const saveGSrc = (o) => { try { window.localStorage.setItem(GSRC_KEY, JSON.stringify(o)); } catch (e) {} };
const loadMSrcMap = () => { try { const r = window.localStorage.getItem(MSRC_KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } };
const loadMSrc = (id) => { const m = loadMSrcMap(); return Array.isArray(m[id]) ? m[id] : []; };
const saveMSrc = (id, arr) => { try { const m = loadMSrcMap(); if (arr && arr.length) m[id] = arr; else delete m[id]; window.localStorage.setItem(MSRC_KEY, JSON.stringify(m)); } catch (e) {} };

// Claude API 呼び出し。
//  - proxyあり: 自分のバックエンド（Cloudflare Workers等）経由でキーを隠して呼ぶ（推奨・配布向け）
//  - キーあり: ユーザー自身のAPIキーでブラウザから直接呼ぶ（ローカル個人利用 / bring-your-own-key）
//  - どちらもなし: Claude.ai のアーティファクト環境内ならキー不要で動く（フォールバック）
async function callClaude(prompt, cfg) {
  cfg = cfg || {};
  const body = { model: cfg.model || "claude-sonnet-4-6", max_tokens: 1500, messages: [{ role: "user", content: prompt }] };
  if (cfg.proxyUrl) {
    const res = await fetch(cfg.proxyUrl, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "APIエラー");
    return data.content.map((i) => (i.type === "text" ? i.text : "")).join("").trim();
  }
  if (cfg.key) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": cfg.key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "APIエラー");
    return data.content.map((i) => (i.type === "text" ? i.text : "")).join("").trim();
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "APIエラー");
  return data.content.map((i) => (i.type === "text" ? i.text : "")).join("").trim();
}

function MD({ text }) {
  const blocks = []; let list = null;
  const flush = () => { if (list) { blocks.push({ type: "ul", items: list }); list = null; } };
  text.split("\n").forEach((raw) => {
    const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { flush(); const lvl = line.match(/^#+/)[0].length; blocks.push({ type: "h", lvl, text: line.replace(/^#+\s/, "") }); }
    else if (/^[-*]\s/.test(line)) (list = list || []).push(line.replace(/^[-*]\s/, ""));
    else if (/^\d+\.\s/.test(line)) (list = list || []).push(line.replace(/^\d+\.\s/, ""));
    else if (line.trim() === "") flush();
    else { flush(); blocks.push({ type: "p", text: line }); }
  });
  flush();
  const inline = (t) => t.split(/(\*\*[^*]+\*\*)/g).map((p, i) => p.startsWith("**") && p.endsWith("**") ? <strong key={i}>{p.slice(2, -2)}</strong> : <React.Fragment key={i}>{p}</React.Fragment>);
  return <div>{blocks.map((b, i) => b.type === "h" ? <div key={i} className={b.lvl === 1 ? "md-h1" : "md-h2"}>{inline(b.text)}</div> : b.type === "ul" ? <ul key={i} className="md-ul">{b.items.map((it, j) => <li key={j}>{inline(it)}</li>)}</ul> : <p key={i} className="md-p">{inline(b.text)}</p>)}</div>;
}

/* ===== Slack 統合パネル（SABOTTA 配色・明朝＋ゴシックに統一）===== */
.sb-slack{
  --s-bg:#f4f1ea; --s-surface:#fffdf8; --s-surface2:#efe9dd; --s-border:#d8d0c1;
  --s-text:#1f1b16; --s-muted:#5c554b; --s-subtle:#8b8478;
  --s-accent:#c8482f; --s-accent-l:#f3e3de; --s-accent-d:#a83a23;
  --s-teal:#2f6b63; --s-teal-l:#e3efec; --s-amber:#9a7b3f; --s-amber-l:#efe6d4;
  --s-red:#b02929; --s-red-l:#f6e6e2; --s-green:#5f7a3a; --s-green-l:#e9efe0;
  color:var(--s-text); font-size:14px; line-height:1.6;
}
.sb-slack *{ box-sizing:border-box; }
.sb-layout{ display:flex; gap:16px; align-items:flex-start; }
.sb-side{ width:218px; min-width:218px; display:flex; flex-direction:column; gap:6px; }
.sb-main{ flex:1; min-width:0; }
.sb-nav{ display:flex; flex-direction:column; gap:2px; }
.sb-nav-item{ display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:10px; cursor:pointer; color:var(--s-muted); font-size:13.5px; border:1px solid transparent; transition:background .12s,color .12s,border-color .12s; user-select:none; }
.sb-nav-item:hover{ background:var(--s-surface); color:var(--s-text); }
.sb-nav-item.active{ background:var(--s-accent-l); color:var(--s-accent-d); border-color:#e3c5bc; font-weight:600; }
.sb-nav-icon{ width:20px; text-align:center; font-size:15px; flex-shrink:0; }
.sb-nav-badge{ margin-left:auto; background:var(--s-accent); color:#fff; border-radius:9px; font-size:10px; font-weight:700; padding:1px 7px; min-width:18px; text-align:center; }
.sb-me{ font-size:11.5px; color:var(--s-subtle); padding:2px 4px 6px; }
.sb-divider{ height:1px; background:var(--s-border); margin:6px 2px; }
.sb-pollwrap{ background:var(--s-surface); border:1px solid var(--s-border); border-radius:12px; padding:10px; }
.sb-poll-title{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--s-subtle); margin:2px 0 6px; }
.sb-toggle{ display:flex; align-items:center; justify-content:space-between; padding:7px 9px; border-radius:9px; cursor:pointer; margin-bottom:8px; border:1px solid var(--s-border); }
.sb-toggle.on{ background:var(--s-teal-l); border-color:#bcd6cf; }
.sb-toggle.off{ background:var(--s-red-l); border-color:#e3c2bc; }
.sb-toggle-label{ font-size:11.5px; font-weight:600; }
.sb-toggle.on .sb-toggle-label{ color:var(--s-teal); }
.sb-toggle.off .sb-toggle-label{ color:var(--s-red); }
.sb-toggle-knob{ width:34px; height:18px; border-radius:9px; position:relative; flex-shrink:0; transition:background .2s; }
.sb-toggle.on .sb-toggle-knob{ background:var(--s-teal); }
.sb-toggle.off .sb-toggle-knob{ background:var(--s-subtle); }
.sb-toggle-knob::after{ content:""; position:absolute; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .2s; left:2px; }
.sb-toggle.on .sb-toggle-knob::after{ left:18px; }
.sb-radio{ display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--s-muted); }
.sb-radio:hover{ background:var(--s-bg); }
.sb-radio.active{ color:var(--s-accent-d); font-weight:600; }
.sb-radio-dot{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--s-border); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.sb-radio.active .sb-radio-dot{ border-color:var(--s-accent); }
.sb-radio-dot i{ width:7px; height:7px; border-radius:50%; background:var(--s-accent); display:block; }
.sb-datebox{ padding:4px 6px 2px; }
.sb-datelabel{ font-size:11px; color:var(--s-muted); margin-bottom:3px; }
.sb-date-input{ width:100%; padding:6px 8px; border:1px solid var(--s-border); border-radius:8px; background:var(--s-surface); color:var(--s-text); font-size:12.5px; font-family:inherit; margin-bottom:6px; }

// ═══════════════════════════════════════════════════════════════
//  Slack 統合パネル（既存 FastAPI バックエンドの API をそのまま利用）
//  UI は SABOTTA に統一（明朝＋ゴシック・朱/金/緑）。
//  バックエンド未接続でも壊れず、接続ガイドを表示する。
// ═══════════════════════════════════════════════════════════════
let SLACK_BASE = ""; // 同一オリジン配信なら空文字、別URLなら http://localhost:8000 等
async function slApi(path, opts = {}) {
  const res = await fetch(SLACK_BASE + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function slTimeAgo(iso) {
  if (!iso) return "—";
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 60) return "たった今";
  if (d < 3600) return `${Math.floor(d / 60)}分前`;
  if (d < 86400) return `${Math.floor(d / 3600)}時間前`;
  return `${Math.floor(d / 86400)}日前`;
}
function slToday() { return new Date().toISOString().slice(0, 10); }
function slMd(text) { return (text || "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^- /gm, "• "); }
function slConfirm(msg) { try { return (typeof window !== "undefined" && window.confirm) ? window.confirm(msg) : true; } catch (e) { return true; } }

// ── Today ───────────────────────────────────────────────────────
function SlackToday({ setPage, setChatHint, reloadKey }) {
  const [stats, setStats] = useState(null);
  const [summaries, setSummaries] = useState([]);
  const [inbox, setInbox] = useState([]);

// ── 要約 ────────────────────────────────────────────────────────
function SlackSummaries({ setChatHint, setPage, reloadKey }) {
  const [summaries, setSummaries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [open, setOpen] = useState({});
  useEffect(() => {
    slApi("/api/summaries").then((d) => { setSummaries(d); const o = {}; d.forEach((s) => { if (s.priority === 1) o[s.id] = true; }); setOpen(o); }).catch(() => {}).finally(() => setLoading(false));
    const t = setInterval(() => slApi("/api/summaries").then(setSummaries).catch(() => {}), 30000);
    return () => clearInterval(t);
  }, [reloadKey]);
  const togglePriority = async (s) => {
    const newP = s.priority === 1 ? 0 : 1;
    await slApi(`/api/channels/${s.channel_id}/priority`, { method: "PATCH", body: JSON.stringify({ priority: newP }) });
    setSummaries((ss) => ss.map((x) => x.channel_id === s.channel_id ? { ...x, priority: newP } : x));
  };
  if (loading) return <div className="empty"><div className="spinner" /></div>;
  if (!summaries.length) return <div className="empty"><span className="empty-icon">📋</span>要約がまだありません。<br />上部の「⚡ 取得」ボタンを押してください（チャンネル未登録の場合は「Slack設定」で追加）。</div>;
  const priority = summaries.filter((s) => s.priority === 1);
  const normal = summaries.filter((s) => s.priority !== 1);
  const renderSummary = (s) => (
    <div key={s.id} className="card card-sm" style={{ marginBottom: 10 }}>
      <div className="accordion-header" onClick={() => setOpen((o) => ({ ...o, [s.id]: !o[s.id] }))}>
        <span className="accordion-arrow" style={{ transform: open[s.id] ? "rotate(90deg)" : "rotate(0deg)", transition: "transform .2s" }}>▶</span>
        <span className="channel-badge">{s.priority === 1 && <span className="priority-star">⭐</span>} #{s.channel_name}</span>
        <span className="meta-row" style={{ marginLeft: "auto" }}>{slTimeAgo(s.created_at)}</span>
        <button className="icon-btn" title={s.priority === 1 ? "重要解除" : "重要にする"} onClick={(e) => { e.stopPropagation(); togglePriority(s); }} style={{ fontSize: 15 }}>{s.priority === 1 ? "⭐" : "☆"}</button>
      </div>
      {open[s.id] && (
        <div style={{ marginTop: 10 }}>
          <div className="summary-md" dangerouslySetInnerHTML={{ __html: slMd(s.content) }} />
          <button className="inline-ai-btn" onClick={() => { setChatHint(`summary:#${s.channel_name}`); setPage("chat"); }}>🤖 この要約について質問する</button>
        </div>
      )}
    </div>
  );
  return (
    <div>
      <h1 className="page-title">チャンネル要約</h1>
      <p className="page-subtitle">チャンネル名の横の ☆ で重要チャンネルに設定できます</p>
      {priority.length > 0 && <><div className="section-head">⭐ 重要チャンネル</div>{priority.map(renderSummary)}</>}
      {normal.length > 0 && <><div className="section-head">通常チャンネル</div>{normal.map(renderSummary)}</>}
    </div>
  );
}

// ── タスク用モーダル ────────────────────────────────────────────
function SlackAddTaskModal({ onClose, onAdded }) {
  const [desc, setDesc] = useState(""); const [assignee, setAssignee] = useState(""); const [due, setDue] = useState(""); const [saving, setSaving] = useState(false);
  const save = async () => {
    if (!desc.trim()) return; setSaving(true);
    try { await slApi("/api/tasks", { method: "POST", body: JSON.stringify({ description: desc, assignee, due }) }); onAdded(); onClose(); }
    catch (e) { setSaving(false); }
  };
  return (
    <div className="sb-slack-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="sb-slack"><div className="modal">
        <div className="modal-title">＋ タスクを追加</div>
        <div className="modal-field"><div className="modal-label">タスク内容 *</div><input className="modal-input" value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="例: 〇〇さんに報告する" autoFocus onKeyDown={(e) => e.key === "Enter" && save()} /></div>
        <div className="modal-field"><div className="modal-label">担当者</div><input className="modal-input" value={assignee} onChange={(e) => setAssignee(e.target.value)} placeholder="自分" /></div>
        <div className="modal-field"><div className="modal-label">期限</div><input className="modal-input" type="date" value={due} onChange={(e) => setDue(e.target.value)} /></div>
        <div className="modal-actions"><button className="btn btn-ghost" onClick={onClose}>キャンセル</button><button className="btn btn-primary" onClick={save} disabled={saving || !desc.trim()}>追加</button></div>
      </div></div>
    </div>
  );
}
function SlackReminderModal({ task, onClose, onSaved }) {

// ── タスク ──────────────────────────────────────────────────────
function SlackTasks({ setChatHint, setPage, reloadKey }) {
  const [tasks, setTasks] = useState([]); const [loading, setLoading] = useState(true);
  const [showDone, setShowDone] = useState(false); const [onlyMine, setOnlyMine] = useState(true);
  const [filter, setFilter] = useState(""); const [showAdd, setShowAdd] = useState(false);
  const [reminderTask, setReminderTask] = useState(null); const [dueReminders, setDueReminders] = useState([]);
  const [localTasks, setLocalTasks] = useState(() => { const t = loadTasks(); return Array.isArray(t) ? t : []; });
  const toggleLocal = (id) => { setLocalTasks((prev) => { const next = prev.map((x) => x.id === id ? { ...x, done: !x.done } : x); saveTasks(next); return next; }); };
  const delLocal = (id) => { if (!slConfirm("この会議タスクを削除しますか？")) return; setLocalTasks((prev) => { const next = prev.filter((x) => x.id !== id); saveTasks(next); return next; }); };
  const load = useCallback(() => slApi("/api/tasks?include_done=true").then(setTasks).catch(() => {}).finally(() => setLoading(false)), []);
  useEffect(() => { load(); const checkR = () => slApi("/api/tasks/reminders").then(setDueReminders).catch(() => {}); checkR(); const t = setInterval(checkR, 60000); return () => clearInterval(t); }, [load, reloadKey]);
  const toggle = async (task) => { const d = !task.done; setTasks((ts) => ts.map((t) => t.id === task.id ? { ...t, done: d, inbox: 0 } : t)); await slApi(`/api/tasks/${task.id}`, { method: "PATCH", body: JSON.stringify({ done: d }) }); };
  const approve = async (task) => { setTasks((ts) => ts.map((t) => t.id === task.id ? { ...t, inbox: 0 } : t)); await slApi(`/api/tasks/${task.id}/approve`, { method: "POST" }); };
  const del = async (task) => { if (!slConfirm(`「${task.description}」を削除しますか？`)) return; setTasks((ts) => ts.filter((t) => t.id !== task.id)); await slApi(`/api/tasks/${task.id}`, { method: "DELETE" }); };
  const baseList = tasks.filter((t) => showDone || !t.done).filter((t) => !onlyMine || t.is_mine).filter((t) => !filter || t.description.includes(filter) || (t.assignee || "").includes(filter) || (t.channel_name || "").includes(filter));
  const inboxTasks = baseList.filter((t) => t.inbox && !t.done);
  const todoTasks = baseList.filter((t) => !t.inbox && !t.done);
  const doneTasks = showDone ? baseList.filter((t) => t.done) : [];
  const undone = tasks.filter((t) => !t.done && (!onlyMine || t.is_mine)).length;
  const localShown = localTasks.filter((t) => showDone || !t.done).filter((t) => !filter || (t.text || "").includes(filter) || (t.source || "").includes(filter));
  const TaskRow = ({ t, showApprove }) => (
    <div className="task-item">
      <div className={`task-check ${t.done ? "done" : ""}`} onClick={() => toggle(t)} />
      <div className="task-body">
        <div className={`task-desc ${t.done ? "done" : ""}`}>{t.description}</div>
        <div className="task-tags">
          {t.assignee && <span className="tag tag-assignee">👤 {t.assignee}</span>}
          {t.due && <span className="tag tag-due">📅 {t.due}</span>}
          <span className="tag tag-channel">#{t.channel_name}</span>
          {t.confidence === "low" && <span className="tag tag-low">⚠ 要確認</span>}
          {t.source === "manual" && <span className="tag tag-manual">手動</span>}
          {t.remind_at && <span className="tag tag-remind remind-pulse">🔔 {new Date(t.remind_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>}
        </div>
      </div>
      <div className="task-actions">
        {showApprove && <button className="icon-btn approve" title="確認済みにする" onClick={() => approve(t)}>✓</button>}
        <button className="icon-btn" title="リマインダー" onClick={() => setReminderTask(t)}>🔔</button>
        <button className="icon-btn danger" title="削除" onClick={() => del(t)}>🗑</button>
      </div>
    </div>
  );
  if (loading) return <div className="empty"><div className="spinner" /></div>;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, gap: 8, flexWrap: "wrap" }}>
        <h1 className="page-title" style={{ marginBottom: 0 }}>タスク<span style={{ fontSize: 13, fontWeight: 400, color: "var(--s-muted)", marginLeft: 8 }}>未完了 {undone}件</span></h1>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn btn-ghost btn-sm" onClick={() => { setChatHint("tasks:all"); setPage("chat"); }}>🤖 AIに整理してもらう</button>
          <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>＋ 追加</button>
        </div>
      </div>
      {dueReminders.map((t) => (
        <div key={t.id} className="card card-sm remind-pulse" style={{ borderColor: "var(--s-amber)", background: "var(--s-amber-l)", marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: "var(--s-amber)" }}>🔔 リマインダー: </span><span style={{ fontSize: 13 }}>{t.description}</span><span className="tag tag-channel" style={{ marginLeft: 6 }}>#{t.channel_name}</span>
        </div>
      ))}
      <div className="filter-bar">
        <input className="filter-input" placeholder="タスク・担当者・チャンネルで絞り込み" value={filter} onChange={(e) => setFilter(e.target.value)} />
        <button className={`filter-btn ${onlyMine ? "active" : ""}`} onClick={() => setOnlyMine(true)}>自分のタスク</button>
        <button className={`filter-btn ${!onlyMine ? "active" : ""}`} onClick={() => setOnlyMine(false)}>すべて</button>
        <button className={`filter-btn ${!showDone ? "active" : ""}`} onClick={() => setShowDone(false)}>未完了</button>
        <button className={`filter-btn ${showDone ? "active" : ""}`} onClick={() => setShowDone(true)}>完了含む</button>
      </div>
      {inboxTasks.length > 0 && (
        <div className="card" style={{ marginBottom: 12 }}>
          <div className="inbox-header"><span className="inbox-title">📥 未確認の新着タスク</span><span className="inbox-count">{inboxTasks.length}</span><span style={{ fontSize: 11, color: "var(--s-muted)", marginLeft: 4 }}>✓ で確認済みに、🗑 で削除</span></div>
          {inboxTasks.map((t) => <TaskRow key={t.id} t={t} showApprove={true} />)}
        </div>
      )}
      {todoTasks.length > 0 && (
        <div className="card" style={{ marginBottom: 12 }}><div className="section-head" style={{ marginTop: 0 }}>対応中 ({todoTasks.length}件)</div>{todoTasks.map((t) => <TaskRow key={t.id} t={t} showApprove={false} />)}</div>
      )}
      {showDone && doneTasks.length > 0 && (
        <div className="card"><div className="section-head" style={{ marginTop: 0 }}>完了済み ({doneTasks.length}件)</div>{doneTasks.map((t) => <TaskRow key={t.id} t={t} showApprove={false} />)}</div>
      )}
      {localShown.length > 0 && (
        <div className="card" style={{ marginBottom: 12 }}>
          <div className="section-head" style={{ marginTop: 0 }}>🗒 会議のタスク（SABOTTA）（{localShown.length}件）</div>
          {localShown.map((t) => (
            <div key={t.id} className="task-item">
              <div className={`task-check ${t.done ? "done" : ""}`} onClick={() => toggleLocal(t.id)} />
              <div className="task-body">
                <div className={`task-desc ${t.done ? "done" : ""}`}>{t.text}</div>
                <div className="task-tags">
                  {t.due && <span className="tag tag-due">📅 {String(t.due).replace("T", " ")}</span>}
                  {t.source && <span className="tag tag-channel">🗒 {t.source}</span>}
                  <span className="tag tag-manual">会議</span>
                </div>
              </div>
              <div className="task-actions">
                <button className="icon-btn danger" title="削除" onClick={() => delLocal(t.id)}>🗑</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {inboxTasks.length === 0 && todoTasks.length === 0 && doneTasks.length === 0 && localShown.length === 0 && <div className="empty"><span className="empty-icon">✅</span>タスクはありません</div>}
      {showAdd && <SlackAddTaskModal onClose={() => setShowAdd(false)} onAdded={load} />}
      {reminderTask && <SlackReminderModal task={reminderTask} onClose={() => setReminderTask(null)} onSaved={load} />}
    </div>
  );
}

// ── AIアドバイス ────────────────────────────────────────────────
function SlackChat({ contextHint, clearHint }) {
  const initMsg = contextHint ? `${contextHint} について教えて` : "";
  const [messages, setMessages] = useState([{ role: "assistant", content: "こんにちは。全チャンネルの要約・タスク情報を把握しています。\n優先順位の整理、次のアクション提案、業務改善アドバイスなど何でも相談してください。" }]);
  const [input, setInput] = useState(initMsg); const [loading, setLoading] = useState(false); const [hint] = useState(contextHint || "");
  const bottomRef = useRef(null);
  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages]);
  useEffect(() => { clearHint(); }, []);
  const send = async (text) => {
    const content = text || input.trim(); if (!content || loading) return;
    const newMsgs = [...messages, { role: "user", content }]; setMessages(newMsgs); setInput(""); setLoading(true);
    try { const data = await slApi("/api/chat", { method: "POST", body: JSON.stringify({ messages: newMsgs, context_hint: hint }) }); setMessages((m) => [...m, { role: "assistant", content: data.reply }]); }
    catch (e) { setMessages((m) => [...m, { role: "assistant", content: "エラー: " + e.message }]); }
    finally { setLoading(false); }
  };
  const quickPrompts = ["今日やるべきことを優先順位付けして", "未確認タスクの中で特に重要なものは？", "今週中に対応すべき期限のタスクを教えて", "タスクが多い場合の効率的な進め方をアドバイスして"];
  return (
    <div>
      <h1 className="page-title">AI アドバイス</h1>
      <p className="page-subtitle">要約・タスク情報をもとに、業務をサポートします</p>
      <div className="chat-wrap card">
        <div className="chat-messages">
          {messages.map((m, i) => (<div key={i} className={`msg ${m.role}`}><div className="msg-avatar">{m.role === "user" ? "🙋" : "🤖"}</div><div className="msg-bubble">{m.content}</div></div>))}
          {loading && <div className="msg assistant"><div className="msg-avatar">🤖</div><div className="msg-bubble"><span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" /></div></div>}
          <div ref={bottomRef} />
        </div>
        {messages.length <= 1 && <div className="quick-prompts">{quickPrompts.map((p, i) => <button key={i} className="quick-btn" onClick={() => send(p)}>{p}</button>)}</div>}
        <div className="chat-input-row">
          <textarea className="chat-input" placeholder="質問・相談を入力…（Shift+Enter で改行、Enter で送信）" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} rows={1} />
          <button className="send-btn" onClick={() => send()} disabled={loading || !input.trim()}>➤</button>
        </div>
      </div>
    </div>
  );
}

  const remove = async (id) => { if (!slConfirm("このチャンネルを削除しますか？")) return; await slApi(`/api/channels/${id}`, { method: "DELETE" }); load(); };
  const togglePriority = async (ch) => { const newP = ch.priority === 1 ? 0 : 1; await slApi(`/api/channels/${ch.id}/priority`, { method: "PATCH", body: JSON.stringify({ priority: newP }) }); load(); };
  const priority = channels.filter((c) => c.priority === 1); const normal = channels.filter((c) => c.priority !== 1);

  const fetchPicker = async () => {
    setPickLoading(true); setPickError("");
    try { const list = await slApi("/api/slack/channels"); setPicker(Array.isArray(list) ? list : []); }
    catch (e) { let msg = e.message; try { msg = JSON.parse(e.message).detail || msg; } catch (_) {} setPickError(msg || "取得に失敗しました"); setPicker([]); }
    finally { setPickLoading(false); }
  };
  const registered = new Set(channels.map((c) => c.id));
  const pickList = (picker || []).filter((c) => !pickFilter || c.name.includes(pickFilter) || c.id.includes(pickFilter));
  const pickedIds = Object.keys(picked).filter((k) => picked[k]);
  const togglePick = (id) => setPicked((p) => ({ ...p, [id]: !p[id] }));
  const pickAll = () => { const np = { ...picked }; pickList.forEach((c) => { if (!registered.has(c.id)) np[c.id] = true; }); setPicked(np); };
  const pickNone = () => setPicked({});
  const registerPicked = async () => {
    const targets = (picker || []).filter((c) => picked[c.id] && !registered.has(c.id));
    if (!targets.length) return;
    setBulkBusy(true);
    for (const c of targets) { try { await slApi("/api/channels", { method: "POST", body: JSON.stringify({ id: c.id, name: c.name }) }); } catch (e) {} }
    setPicked({}); await load(); setBulkBusy(false);
  };
  const runPaste = async () => {
    const rows = pasteText.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
      const parts = line.split(/[,\t]| {2,}|\s+/).map((s) => s.trim()).filter(Boolean);
      const id = (parts[0] || "").replace(/^#/, ""); const name = parts.slice(1).join(" ") || id;
      return { id, name };
    }).filter((r) => r.id);
    if (!rows.length) { setPasteMsg("登録できる行がありません。"); return; }
    setBulkBusy(true); let ok = 0;
    for (const r of rows) { try { await slApi("/api/channels", { method: "POST", body: JSON.stringify({ id: r.id, name: r.name }) }); ok++; } catch (e) {} }
    setBulkBusy(false); setPasteText(""); setPasteMsg(`${ok} 件を登録しました。`); await load();
  };

  return (
    <div>
      <h1 className="page-title">Slack 設定</h1>

      <div className="card">
        <div className="card-header"><div className="card-title">監視チャンネル</div></div>
        <p style={{ fontSize: 12, color: "var(--s-muted)", margin: "8px 0 14px", lineHeight: 1.8 }}>⭐ <strong>重要チャンネル</strong>は1時間ごとに自動分析されます。<br />通常チャンネルは「⚡ 取得」を押したときのみ分析されます。</p>
        {!channels.length ? <div className="empty" style={{ padding: "16px 0" }}>チャンネルが登録されていません。下の「一括追加」が便利です。</div> : <>
          {priority.length > 0 && <><div className="section-head" style={{ color: "var(--s-amber)" }}>⭐ 重要チャンネル（自動分析）</div>
            {priority.map((ch) => (<div key={ch.id} className="ch-row"><div><div className="ch-name">#{ch.name}</div><div className="ch-id">{ch.id}</div></div><div className="ch-actions"><button className="btn btn-sm" style={{ background: "var(--s-amber-l)", color: "var(--s-amber)", borderColor: "#ddcba6" }} onClick={() => togglePriority(ch)}>⭐ 重要</button><button className="btn btn-danger btn-sm" onClick={() => remove(ch.id)}>削除</button></div></div>))}
          </>}
          {normal.length > 0 && <><div className="section-head">通常チャンネル（手動のみ）</div>
            {normal.map((ch) => (<div key={ch.id} className="ch-row"><div><div className="ch-name">#{ch.name}</div><div className="ch-id">{ch.id}</div></div><div className="ch-actions"><button className="btn btn-ghost btn-sm" onClick={() => togglePriority(ch)}>☆ 重要にする</button><button className="btn btn-danger btn-sm" onClick={() => remove(ch.id)}>削除</button></div></div>))}
          </>}
        </>}
      </div>

      {/* 一括追加（Slackから取得） */}
      <div className="card" style={{ marginTop: 14 }}>
        <div className="card-header"><div className="card-title">⚡ 一括追加（Slackから取得）</div></div>
        <p style={{ fontSize: 12, color: "var(--s-muted)", margin: "8px 0 12px", lineHeight: 1.8 }}>あなたが<strong>参加しているチャンネル</strong>をSlackから取得し、チェックを入れてまとめて登録できます（最も簡単）。</p>
        {!picker ? (
          <button className="btn btn-primary" onClick={fetchPicker} disabled={pickLoading}>{pickLoading ? "取得中…" : "Slackのチャンネルを取得"}</button>
        ) : (
          <>
            <div className="filter-bar" style={{ marginBottom: 10 }}>
              <input className="filter-input" placeholder="チャンネル名・IDで絞り込み" value={pickFilter} onChange={(e) => setPickFilter(e.target.value)} />
              <button className="filter-btn" onClick={pickAll}>表示中をすべて選択</button>
              <button className="filter-btn" onClick={pickNone}>選択解除</button>
              <button className="btn btn-ghost btn-sm" onClick={fetchPicker} disabled={pickLoading}>{pickLoading ? "更新中…" : "再取得"}</button>
            </div>
            {pickList.length === 0 ? <div className="empty" style={{ padding: "14px 0" }}>該当するチャンネルがありません。</div> : (
              <div style={{ maxHeight: 320, overflowY: "auto", border: "1px solid var(--s-border)", borderRadius: 10 }}>
                {pickList.map((c) => {
                  const reg = registered.has(c.id);
                  return (
                    <label key={c.id} className="ch-row" style={{ cursor: reg ? "default" : "pointer", opacity: reg ? 0.55 : 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <input type="checkbox" disabled={reg} checked={reg || !!picked[c.id]} onChange={() => togglePick(c.id)} style={{ accentColor: "#c8482f" }} />
                        <div>
                          <div className="ch-name">{c.is_private ? "🔒 " : "#"}{c.name}{reg ? "（登録済み）" : ""}</div>
                          <div className="ch-id">{c.id}{c.num_members != null ? ` ・ ${c.num_members}人` : ""}</div>
                        </div>
                      </div>
                    </label>
                  );
                })}
              </div>
            )}
            <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={registerPicked} disabled={bulkBusy || pickedIds.length === 0}>{bulkBusy ? "登録中…" : `選択した ${pickedIds.length} 件を登録`}</button>
          </>
        )}
        {pickError && <div style={{ background: "var(--s-red-l)", color: "var(--s-red)", padding: "8px 12px", borderRadius: 8, fontSize: 12, marginTop: 12, lineHeight: 1.7 }}>⚠️ {pickError}<br />Slackトークンに <code>channels:read</code> / <code>groups:read</code> スコープが必要です。下の「貼り付けで一括追加」も使えます。</div>}
      </div>

      {/* 一括追加（貼り付け） */}
      <div className="card" style={{ marginTop: 14 }}>
        <div className="card-header"><div className="card-title">📋 一括追加（貼り付け）</div></div>
        <p style={{ fontSize: 12, color: "var(--s-muted)", margin: "8px 0 10px", lineHeight: 1.8 }}>1行に1チャンネルを貼り付けます。形式は <code>チャンネルID,チャンネル名</code>（カンマ・タブ・スペース区切り可）。名前は省略可（その場合IDが名前になります）。</p>
        <textarea className="settings-input" style={{ width: "100%", minHeight: 110, fontFamily: "ui-monospace, monospace", fontSize: 12.5, lineHeight: 1.7, resize: "vertical" }} value={pasteText} onChange={(e) => setPasteText(e.target.value)} placeholder={"例:\nC0123ABCD,営業\nC0456EFGH,開発-general\nC0789IJKL"} />
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
          <button className="btn btn-primary" onClick={runPaste} disabled={bulkBusy || !pasteText.trim()}>{bulkBusy ? "登録中…" : "貼り付けた内容を登録"}</button>
          {pasteMsg && <span style={{ fontSize: 12, color: "var(--s-teal)" }}>{pasteMsg}</span>}
        </div>
      </div>

      {/* 単体追加 */}
      <div className="card" style={{ marginTop: 14 }}>
        <div className="card-header"><div className="card-title">＋ 1件ずつ追加</div></div>
        <div className="settings-form" style={{ marginTop: 10 }}>
          <input className="settings-input" placeholder="チャンネルID (C0XXXXXXX)" value={newId} onChange={(e) => setNewId(e.target.value)} />
          <input className="settings-input" placeholder="チャンネル名" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <button className="btn btn-primary" onClick={add} disabled={saving || !newId || !newName}>追加</button>
        </div>
      </div>

      {/* 詳しい手順 */}
      <div className="card" style={{ marginTop: 14 }}>
        <div className="card-title" style={{ marginBottom: 10 }}>📖 チャンネル追加のくわしい手順</div>
        <div style={{ fontSize: 13, color: "var(--s-muted)", lineHeight: 1.95 }}>
          <div className="section-head" style={{ marginTop: 0 }}>方法1：Slackから取得して一括登録（おすすめ）</div>
          1. 上の「⚡ 一括追加」→「<strong>Slackのチャンネルを取得</strong>」を押す。<br />
          2. 参加中のチャンネル一覧が出るので、登録したいものにチェック（「表示中をすべて選択」も可）。<br />
          3. 「<strong>選択した N件を登録</strong>」を押す。登録済みはグレー表示で重複しません。<br />
          ※ この機能には Slackトークンに <code>channels:read</code> / <code>groups:read</code> スコープが必要です。<strong>参加しているチャンネルのみ</strong>取得できます（未参加はSlackで参加してから）。

          <div className="section-head">方法2：貼り付けで一括登録</div>
          1. 「📋 一括追加（貼り付け）」の欄に、1行1チャンネルで貼り付け。<br />
          2. 形式は <code>ID,名前</code>。名前は省略可（IDが名前になります）。カンマ／タブ／スペース区切りに対応。<br />
          3. 「貼り付けた内容を登録」を押す。<br />
          例：<br />
          <code style={{ display: "block", whiteSpace: "pre", background: "var(--s-surface2)", padding: "8px 10px", borderRadius: 8, margin: "4px 0", fontSize: 12 }}>{"C0123ABCD,営業\nC0456EFGH,開発-general\nC0789IJKL"}</code>

          <div className="section-head">チャンネルIDの調べ方</div>
          Slackで対象チャンネルを開く → 上部のチャンネル名をクリック → 「<strong>概要</strong>」タブの一番下に「<strong>チャンネルID: C0XXXXXXX</strong>」が表示されるのでコピー。<br />
          （メッセージのリンクをコピーしたとき末尾の <code>/archives/C0XXXXXXX/...</code> の <code>C0XXXXXXX</code> がIDです）

          <div className="section-head">重要チャンネル（⭐）について</div>
          ⭐ を付けたチャンネルは<strong>1時間ごとに自動で要約・タスク抽出</strong>されます。通常チャンネルは「⚡ 取得」を押したときだけ分析されるので、トークン節約になります。登録後に各行の「☆ 重要にする」で切り替えできます。

          <div className="section-head">ターミナルから登録したい場合</div>
          同梱の <code>python3 select_channels.py</code> でも、一覧から選んで一括登録できます（アプリ起動中に別ターミナルで実行）。
        </div>
      </div>
    </div>
  );
}

// ── セットアップ（トークン入力）──────────────────────────────────
function SlackSetupWizard({ setup, onSaved }) {
  const [slack, setSlack] = useState(""); const [anth, setAnth] = useState(""); const [saving, setSaving] = useState(false); const [error, setError] = useState("");
  const save = async () => {
    setSaving(true); setError("");
    try { await slApi("/api/setup/tokens", { method: "POST", body: JSON.stringify({ slack_token: slack, anthropic_key: anth }) }); onSaved(); }
    catch (e) { let msg = e.message; try { msg = JSON.parse(e.message).detail || msg; } catch (_) {} setError(msg); }
    finally { setSaving(false); }
  };
  return (
    <div style={{ maxWidth: 560, margin: "8px auto" }}>
      <h1 className="page-title">🚀 Slack 連携をはじめる</h1>
      <p className="page-subtitle">2つのトークンを貼り付けて保存してください。入力値はあなたのPC内にのみ保存され、外部には送信されません。</p>
      <div className="card">
        <div className="modal-field">
          <div className="modal-label">{setup && setup.has_slack_token ? "✅ " : ""}Slack User Token（xoxp- で始まる）</div>
          <input className="modal-input" value={slack} onChange={(e) => setSlack(e.target.value)} placeholder={setup && setup.has_slack_token ? "設定済み（変更する場合のみ入力）" : "xoxp-..."} type="password" autoComplete="off" />
          <div style={{ fontSize: 11, color: "var(--s-subtle)", marginTop: 6, lineHeight: 1.6 }}>取得方法: <a href="https://api.slack.com/apps" target="_blank" rel="noreferrer" style={{ color: "var(--s-accent-d)" }}>api.slack.com/apps</a> でアプリ作成 → OAuth &amp; Permissions → User Token Scopes に channels:history / groups:history / channels:read / groups:read / users:read を追加 → Install</div>
        </div>
        <div className="modal-field" style={{ marginTop: 14 }}>
          <div className="modal-label">{setup && setup.has_anthropic_key ? "✅ " : ""}Anthropic API Key（sk-ant- で始まる）</div>
          <input className="modal-input" value={anth} onChange={(e) => setAnth(e.target.value)} placeholder={setup && setup.has_anthropic_key ? "設定済み（変更する場合のみ入力）" : "sk-ant-..."} type="password" autoComplete="off" />
          <div style={{ fontSize: 11, color: "var(--s-subtle)", marginTop: 6 }}>取得方法: <a href="https://console.anthropic.com/keys" target="_blank" rel="noreferrer" style={{ color: "var(--s-accent-d)" }}>console.anthropic.com/keys</a> で Create Key</div>
        </div>
        {error && <div style={{ background: "var(--s-red-l)", color: "var(--s-red)", padding: "8px 12px", borderRadius: 8, fontSize: 12, marginTop: 12 }}>⚠️ {error}</div>}
        <button className="btn btn-primary" style={{ marginTop: 16, width: "100%", padding: "11px" }} onClick={save} disabled={saving || (!slack && !(setup && setup.has_slack_token)) || (!anth && !(setup && setup.has_anthropic_key))}>{saving ? "確認中…" : "保存して始める"}</button>
      </div>
      <p style={{ fontSize: 11, color: "var(--s-subtle)", textAlign: "center", marginTop: 10 }}>Slackトークンが正しいか自動で確認します（数秒かかることがあります）</p>
    </div>
  );
}

// ── Slack パネル本体（接続管理＋ナビ＋取得コントロール）──────────
function SlackPanel({ base, onChangeBase, onBack }) {
  SLACK_BASE = (base || "").trim().replace(/\/+$/, "");
  const [conn, setConn] = useState("checking"); // checking | ok | off
  const [setup, setSetup] = useState(null);
  const [page, setPage] = useState("today");
  const [chatHint, setChatHint] = useState("");
  const [stats, setStats] = useState(null);
  const [autoPoll, setAutoPoll] = useState(true);
  const [pollMode, setPollMode] = useState("today");
  const [dateFrom, setDateFrom] = useState(slToday());
  const [dateTo, setDateTo] = useState(slToday());
  const [priorityOnly, setPriorityOnly] = useState(false);
  const [polling, setPolling] = useState(false);
  const [progress, setProgress] = useState(null);
  const [lastPoll, setLastPoll] = useState(null);
  const [urlDraft, setUrlDraft] = useState(base || "");
  const [skipped, setSkipped] = useState(false); // 未接続でもスキップして中を見る
  const [dataVersion, setDataVersion] = useState(0); // 取得後にページを即時更新するためのキー
  const [pollMsg, setPollMsg] = useState(""); // 取得結果・エラー表示

  const check = useCallback(async () => {
    setConn("checking");
    try {
      const s = await slApi("/api/setup");
      setSetup(s); setConn("ok");
      slApi("/api/stats").then(setStats).catch(() => {});
      slApi("/api/auto-poll").then((d) => setAutoPoll(d.enabled)).catch(() => {});
    } catch (e) { setConn("off"); }
  }, [base]);
  useEffect(() => { check(); }, [check]);
  useEffect(() => { if (conn !== "ok") return; const t = setInterval(() => slApi("/api/stats").then(setStats).catch(() => {}), 30000); return () => clearInterval(t); }, [conn]);

  const toggleAutoPoll = async () => { const next = !autoPoll; setAutoPoll(next); try { await slApi(next ? "/api/auto-poll/resume" : "/api/auto-poll/pause", { method: "POST" }); } catch (e) { setAutoPoll(!next); } };
  const modeLabel = { today: "本日分", range: "期間指定", incremental: "前回以降" };
  const pollNow = async () => {
    setPolling(true); setPollMsg("");
    const pt = setInterval(() => slApi("/api/poll/status").then(setProgress).catch(() => {}), 800);
    try {
      // 対象チャンネルの有無を事前チェック（未登録なら分かりやすく案内）
      let chs = [];
      try { chs = await slApi("/api/channels"); } catch (e) {}
      const target = priorityOnly ? chs.filter((c) => c.priority === 1) : chs;
      if (Array.isArray(chs) && target.length === 0) {
        setPollMsg(priorityOnly ? "重要チャンネルがありません。「Slack設定」で⭐を付けるか、チェックを外してください。" : "対象チャンネルがありません。「Slack設定」でチャンネルを追加してください。");
        return;
      }
      await slApi("/api/poll", { method: "POST", body: JSON.stringify({ mode: pollMode, date_from: dateFrom, date_to: dateTo, priority_only: priorityOnly }) });
      setLastPoll(new Date().toISOString());
      let st = null; try { st = await slApi("/api/poll/status"); } catch (e) {}
      setDataVersion((v) => v + 1); // 表示中ページを即時リロード
      slApi("/api/stats").then(setStats).catch(() => {});
      if (st && st.last_error) setPollMsg("取得時にエラー: " + st.last_error);
      else setPollMsg(`取得しました（${(st && st.total) || target.length}チャンネル）。新着がなければ要約は増えません。`);
    } catch (e) {
      let msg = e.message; try { msg = JSON.parse(e.message).detail || msg; } catch (_) {}
      setPollMsg("取得に失敗しました: " + msg);
    } finally { clearInterval(pt); setProgress(null); setPolling(false); }
  };
  const applyUrl = () => { const v = urlDraft.trim().replace(/\/+$/, ""); onChangeBase(v); };

  const Back = <button className="sb-back" onClick={onBack} title="SABOTTA に戻る"><span className="sb-back-ar">←</span> SABOTTA に戻る</button>;

  if (conn === "checking") return (
    <div className="sb-screen">
      <div className="sb-screen-bar">{Back}<span className="sb-screen-title">Slack</span></div>
      <div className="sb-screen-body"><div className="sb-slack"><div className="empty"><div className="spinner" /><div style={{ marginTop: 12 }}>Slackバックエンドに接続中…</div></div></div></div>
    </div>
  );

  if (conn === "off" && !skipped) return (
    <div className="sb-screen">
      <div className="sb-screen-bar">{Back}<span className="sb-screen-title">Slack</span></div>
      <div className="sb-screen-body"><div className="sb-slack"><div className="sb-disconnected">
        <div className="sb-dc-ic">🔌</div>
        <h3>Slackバックエンドに接続できません</h3>
        <p>Slackの要約・タスク機能には、付属のローカルサーバー（Python / FastAPI）が必要です。会議アシスタント機能はサーバーなしでそのまま使えます。</p>
        <div className="sb-dc-steps">
          <div><strong>起動方法</strong></div>
          1. 同梱の <code>起動_Mac.command</code> または <code>起動_Windows.bat</code> をダブルクリック（初回はトークン設定が必要）。<br />
          2. もしくはターミナルで <code>bash start.sh</code> を実行。<br />
          3. 起動後、このページが <code>http://localhost:8000</code> で配信されていれば自動接続します。
        </div>
        <div className="sb-dc-steps"><div><strong>別のアドレスで動かしている場合</strong>（このHTMLをGitHub Pages等から開いている場合など）はURLを指定してください：</div></div>
        <div className="sb-urlrow">
          <input className="modal-input" value={urlDraft} onChange={(e) => setUrlDraft(e.target.value)} placeholder="http://localhost:8000" />
          <button className="btn btn-primary" onClick={applyUrl}>接続</button>
          <button className="btn" onClick={check}>再試行</button>
        </div>
        <div style={{ marginTop: 16 }}>
          <button className="btn btn-ghost" onClick={() => setSkipped(true)}>スキップして中を見る（プレビュー）→</button>
        </div>
        <p style={{ marginTop: 12, fontSize: 11.5 }}>※ <code>https://</code> のページから <code>http://localhost</code> へは、ブラウザの混在コンテンツ制限で接続できないことがあります。その場合はバックエンドが配信する <code>http://localhost:8000</code> を直接開いてください。</p>
      </div></div></div>
    </div>
  );

  if (setup && !setup.ready) return (
    <div className="sb-screen">
      <div className="sb-screen-bar">{Back}<span className="sb-screen-title">Slack 連携</span></div>
      <div className="sb-screen-body"><div className="sb-slack"><SlackSetupWizard setup={setup} onSaved={check} /></div></div>
    </div>
  );

  const navItems = [
    { id: "today", icon: IC.calendar, label: "Today" },
    { id: "summaries", icon: IC.book, label: "要約" },
    { id: "tasks", icon: IC.tasks, label: "タスク", badge: stats && stats.inbox > 0 ? stats.inbox : null },
    { id: "chat", icon: IC.sparkle, label: "アドバイス" },
    { id: "settings", icon: IC.settings, label: "設定" },
  ];

  return (
    <div className="sb-screen">
      <div className="sb-slack sb-shell">
        <nav className="ma-rail">

  const toggleSource = (scope, id) => { const fn = (p) => p.map((x) => (x.id === id ? { ...x, on: !x.on } : x)); scope === "global" ? setGSources(fn) : setMSources(fn); };
  const delSource = (scope, id) => { const fn = (p) => p.filter((x) => x.id !== id); scope === "global" ? setGSources(fn) : setMSources(fn); };
  const srcSelectedChars = () => [...gSources, ...mSources].filter((s) => s.on).reduce((n, s) => n + (s.text ? s.text.length : 0), 0);

  const transcribeFile = async (file, mode) => {

  const tSec = (mmss) => { const p = (mmss || "0:0").split(":").map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };

{"summary":["要点を3〜6個"],"decisions":["決まったこと。なければ []"],"actions":[{"task":"やるべきこと","owner":"担当者（話者名等。なければ空文字）"}],"advice":["進行アドバイスや次に確認すべき質問を2〜4個"],"topics":["主要トピックの短いタグ数個"]}${vocabBlock()}${sourceBlock()}${prior}

                    <label className="ma-fld"><span>内容（貼り付け）</span><textarea className="ma-fld-in" style={{ minHeight: 100, resize: "vertical" }} value={srcText} onChange={(e) => setSrcText(e.target.value)} placeholder="資料の本文を貼り付け…" /></label>
                    <div className="ma-fldrow">
                      <label className="ma-fld"><span>またはファイル（.txt / .md）</span><input className="ma-fld-in" type="file" accept=".txt,.md,text/plain" onChange={(e) => onSourceFile(e, srcTab)} /></label>
                      <button className="ma-addbtn" onClick={() => addSource(srcTab)}>追加</button>
                    </div>
                  </div>
                  <div className="ma-set-status" style={{ marginTop: 4 }}>AIに渡す合計: 約 {sel.toLocaleString()} 文字{sel > SRC_BUDGET ? `（上限 ${SRC_BUDGET.toLocaleString()} 文字を超える分は送信時に省略されます）` : ""}</div>
                  {list.length === 0 && <p className="ma-empty" style={{ padding: "10px 2px" }}>{srcTab === "global" ? "全会議で使う資料（用語集・製品情報など）を登録します。" : "この会議用の資料（アジェンダ・関連資料など）を登録します。"}</p>}
                  {list.map((s) => (
                    <div className={`ma-task${s.on ? "" : " done"}`} key={s.id}>
                      <input type="checkbox" checked={s.on} onChange={() => toggleSource(srcTab, s.id)} title="AIに渡す/渡さない" />
                      <div className="ma-task-main">
                        <div className="ma-task-text" style={{ cursor: "default" }}>{s.title}</div>
                        <div className="ma-task-meta"><span>{(s.text ? s.text.length : 0).toLocaleString()} 文字</span><span>{s.on ? "ON（AIに渡す）" : "OFF"}</span></div>
                      </div>
                      <button className="ma-del" onClick={() => delSource(srcTab, s.id)}>削除</button>
                    </div>
                  ))}
                  <p className="ma-set-note" style={{ marginTop: 14 }}>※ 「この会議」のソースはその会議にのみ、「アプリ全体」のソースは全会議に適用されます。資料が数万字を超えるほど大きい場合は、関連箇所だけを抽出する方式（RAG）への拡張を検討します。</p>
                </div>
              </div>
            </div>
          );
        })()}

        <div className="ma-grid">
          <div className="ma-l">
            <div className="ma-card">
              <div className="ma-label"><h2>文字起こし</h2>{(recording || capturing || ocrOn) && <span className="ma-recpill">{recording ? "● 録音中" : capturing ? "● 会議音声 取込中" : "● 字幕読取中"}</span>}<span className="ma-mini">{shown.length}/{segments.length} 表示</span></div>

              {/* 自動話者分離 */}
              <div className="ma-diar">
                <div className="ma-diarhead">
                  <label className="ma-switch"><input type="checkbox" checked={autoDiar} onChange={(e) => setAutoDiar(e.target.checked)} /> 🤖 自動話者分離</label>
                  <span className="ma-mini">{autoDiar ? `検出 ${autoCount} 名` : "OFF（手動ラベル）"}</span>
                  {autoDiar && <button className="ma-diar-adv" onClick={() => setDiarAdv((v) => !v)}>{diarAdv ? "詳細を隠す" : "詳細設定"}</button>}
                </div>
                {autoDiar && diarAdv && (
                  <div className="ma-diarbody">
                    <div className="ma-slider">
                      <span>← 細かく分ける</span>
                      <input type="range" min="0.18" max="0.55" step="0.01" value={threshold} onChange={(e) => setThreshold(Number(e.target.value))} />
                      <span>まとめる →</span>
                    </div>
                    <div className="ma-recl">
                      <span>人数を指定して再分離:</span>
                      <input type="number" min="1" max="8" value={kInput} onChange={(e) => setKInput(e.target.value)} />
                      <span>名</span>
                      <button className="ma-mini-btn" onClick={recluster}>再分離</button>
                    </div>
                  </div>
                )}
              </div>

              {/* 話者チップ（手動補正・命名） */}
              <div className="ma-spkbar">
                <span className="lab" title="チップをダブルクリックで名前を変更できます">話者:</span>
                {speakers.map((s) => (
                  editSpk === s
                    ? <input key={s} className="ma-spkadd" autoFocus defaultValue={s} onBlur={(e) => renameSpeaker(s, e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); else if (e.key === "Escape") setEditSpk(null); }} style={{ borderColor: spkColor(s), width: 90 }} />
                    : <button key={s} className={`ma-chip${curSpeaker === s ? " on" : ""}`} onClick={() => pickSpeaker(s)} onDoubleClick={() => setEditSpk(s)} title="クリックで選択／ダブルクリックで名前を変更" style={{ borderColor: spkColor(s), color: curSpeaker === s ? "#fff" : spkColor(s), background: curSpeaker === s ? spkColor(s) : "transparent" }}>{s}</button>
                ))}
                <input className="ma-spkadd" value={newSpeaker} placeholder="＋ 追加" onChange={(e) => setNewSpeaker(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSpeaker()} />
              </div>

              <div className="ma-tools">
                <input className="ma-search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="🔍 文字起こし内を検索" />
                <label className="ma-toggle"><input type="checkbox" checked={onlyHl} onChange={(e) => setOnlyHl(e.target.checked)} /> 重要のみ</label>
                <label className="ma-toggle"><input type="checkbox" checked={liveTranslate} onChange={(e) => setLiveTranslate(e.target.checked)} /> リアルタイム翻訳</label>
                {liveTranslate && <select className="ma-sel" style={{ padding: "5px 7px", fontSize: 12 }} value={target} onChange={(e) => setTarget(e.target.value)}>{TRANSLATE_TO.map((t) => <option key={t} value={t}>{t}</option>)}</select>}
              </div>

              <div className="ma-transcript" ref={scrollRef} onScroll={onTranscriptScroll}>
                {segments.length === 0 && !interim && (
                  <p className="ma-empty">「録音」でマイクからの文字起こしと自動話者分離が始まります（発言ごとに話者A/B/C…を推定して色分け、誤りは手動修正や「人数を指定して再分離」で補正可）。<br /><br />Web会議の相手の声を文字起こしするには上部の「会議音声」を押し、共有ダイアログで会議の<strong>タブ</strong>を選んで<strong>「タブの音声を共有」をオン</strong>にしてください（PCのChrome/Edge専用）。文字起こしはブラウザ内（あなたのPC）で行われ、クラウドには送られません。</p>
                )}
                {shown.map((s) => (
                  <div key={s.id} className={`ma-seg${s.hl ? " hl" : ""}`}>
                    <span className="ma-ts">{s.t}</span>
                    <div className="ma-segmain">
                      {(speakers.length > 0 || s.speaker) && (
                        <select className="ma-spklab" value={s.speaker || ""} onChange={(e) => setSegSpeaker(s.id, e.target.value)} style={{ color: spkColor(s.speaker) }}>
                          <option value="">（話者なし）</option>
                          {speakers.map((sp) => <option key={sp} value={sp}>{sp}</option>)}
                        </select>
                      )}
                      {editId === s.id
                        ? <textarea className="ma-edit" rows={2} autoFocus value={editVal} onChange={(e) => setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); } }} />
                        : <div className="ma-segtext" onClick={() => startEdit(s)}>{hl(s.text)}</div>}
                      {s.tr && <div className="ma-tr">{s.tr}</div>}
                    </div>
                    <div className="ma-act">
                      <button className="ma-ibtn" onClick={() => addTask(s.text)} title="自分のタスクに追加">＋✓</button>
                      <button className={`ma-ibtn star${s.hl ? " on" : ""}`} onClick={() => toggleHl(s.id)} title="重要マーク">★</button>
                      <button className="ma-ibtn" onClick={() => delSeg(s.id)} title="削除">✕</button>
                    </div>
                  </div>
                ))}
                {interim && <div className="ma-interim">{interim}…</div>}
                {!atBottom && segments.length > 4 && <button className="ma-jump" onClick={scrollToBottom}>↓ 最新の発言へ</button>}
              </div>

              {segments.length > 0 && (
                <div className="ma-foottools"><span className="ma-toollab">書き出し</span><button className="ma-tool" onClick={() => copy(buildText())}>コピー</button><button className="ma-tool" onClick={() => download(buildText(), "txt")}>TXT</button><button className="ma-tool" onClick={exportSRT}>SRT字幕</button><button className="ma-tool" onClick={printTranscript}>PDF</button></div>
              )}
            </div>
          </div>

          <div className="ma-r">
            <div className="ma-card">
              <div className="ma-tabs">{[["ai", "要約・アドバイス"], ["memo", "メモ"], ["minutes", "整形議事録"], ["proof", "校正"], ["translate", "翻訳"]].map(([k, v]) => <button key={k} className={`ma-tab${tab === k ? " on" : ""}`} onClick={() => setTab(k)}>{v}</button>)}</div>
              {(() => { const sc = [...gSources, ...mSources].filter((x) => x.on).length; const vc = (vocab || "").split("\n").filter((l) => l.trim()).length; return (sc > 0 || vc > 0) ? <div className="ma-grounding" onClick={() => openOnly("sources")} title="クリックでソースを確認"><IC.book s={13} /> AIが参照中：{sc > 0 ? `ソース${sc}件` : ""}{sc > 0 && vc > 0 ? "・" : ""}{vc > 0 ? `用語${vc}件` : ""}</div> : null; })()}
              {!apiKey && !proxyUrl && <div className="ma-warn">AI機能（要約・議事録・翻訳・自動命名）には接続設定が必要です。右上の ⚙ から「プロキシURL」または「APIキー」を設定してください。（Claude.ai アプリ内では不要）</div>}
              <div className="ma-rbody">

              {tab === "ai" && (<>
                <button className="ma-btn" onClick={analyze} disabled={analyzing}>{analyzing ? <><span className="ma-spin" /> 分析中…</> : "▷ AIで要約・アドバイスを生成"}</button>
                <label className="ma-auto"><input type="checkbox" checked={auto} onChange={(e) => setAuto(e.target.checked)} /> 録音・取込中は約2分ごとに自動更新</label>
                {!analysis && !analyzing && <p className="ma-empty" style={{ padding: "6px 2px" }}>会話がたまったらボタンを押すと、要点・決定事項・アクション・進行アドバイスを整理します。</p>}
                {(analyzedAt || analyzing) && <div className="ma-mini" style={{ marginBottom: 6 }}>{analyzing ? "更新中…" : `最終更新 ${new Date(analyzedAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}`}</div>}
                {analysis && (<div className="ma-aigrid">
                  <Sec title="要約" mini="SUMMARY"><ul className="ma-list">{(analysis.summary || []).map((x, i) => <li key={i}>{x}</li>)}</ul></Sec>
                  {(analysis.decisions || []).length > 0 && <Sec title="決定事項" mini="DECISIONS"><ul className="ma-list">{analysis.decisions.map((x, i) => <li key={i}>{x}</li>)}</ul></Sec>}
                  {(analysis.actions || []).length > 0 && <Sec title="アクションアイテム" mini="TO-DO">{analysis.actions.map((a, i) => <div className="ma-action" key={i}><span className="t">{a.task}</span>{a.owner ? <span className="ma-owner">{a.owner}</span> : null}<button className="ma-addtask" title="マイタスクに追加" onClick={() => addTask(a.owner ? `${a.task}（${a.owner}）` : a.task)}>＋</button></div>)}</Sec>}
                  {(analysis.advice || []).length > 0 && <Sec title="アドバイス" mini="ADVICE"><ul className="ma-list ma-advice">{analysis.advice.map((x, i) => <li key={i}>{x}</li>)}</ul></Sec>}
                  {(analysis.topics || []).length > 0 && <Sec title="トピック" mini="TAGS"><div className="ma-tags">{analysis.topics.map((x, i) => <span className="ma-tag" key={i}>#{x}</span>)}</div></Sec>}
                </div>)}
              </>)}

              {tab === "memo" && (<>
                <p className="ma-empty" style={{ padding: "2px 2px 8px" }}>会議中に要点や気づきをメモしておくと、議事録の生成時にAIが<strong>このメモを骨子</strong>として整形し、抜けを文字起こしで補完します（Granola方式）。</p>
                <textarea className="ma-memo" value={myNotes} onChange={(e) => setMyNotes(e.target.value)} placeholder={"例）\n・予算は来期で確定、上限300万\n・田中さんが先方に見積り依頼（今週中）\n・次回は要件定義のレビュー"} />
                <div className="ma-mini" style={{ marginTop: 8 }}>{myNotes.trim() ? `${myNotes.trim().length} 文字 ・ 議事録に反映されます` : "自動保存されます"}</div>
              </>)}

              {tab === "minutes" && (<>
                <div className="ma-optrow">
                  <label>形式<select value={minTemplate} onChange={(e) => setMinTemplate(e.target.value)}>{["汎用", "商談", "1on1", "朝会", "ブレスト", "面接"].map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
                  <label>長さ<select value={minLength} onChange={(e) => setMinLength(e.target.value)}>{["短", "標準", "詳細"].map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
                  <label>トーン<select value={minTone} onChange={(e) => setMinTone(e.target.value)}>{["ビジネス", "カジュアル", "テック"].map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
                </div>
                <button className="ma-btn" onClick={genMinutes} disabled={minLoad}>{minLoad ? <><span className="ma-spin" /> 作成中…</> : "▷ 整形された議事録を生成"}</button>
                {myNotes.trim() && <div className="ma-mini" style={{ margin: "-6px 0 8px" }}>あなたのメモを骨子に反映します</div>}
                {!minutes && !minLoad && <p className="ma-empty" style={{ padding: "6px 2px" }}>出席者・議題・決定事項・アクションを構造化した、そのまま提出できる議事録を作成します。</p>}
                {minutes && (<><MD text={minutes} /><div className="ma-foottools" style={{ marginTop: 14 }}><button className="ma-tool" onClick={() => copy(minutes)}>コピー</button><button className="ma-tool" onClick={() => download(minutes, "md")}>.md</button><button className="ma-tool" onClick={() => downloadDoc(minutes)}>Word(.doc)</button><button className="ma-tool" onClick={printMinutes}>印刷/PDF</button><button className="ma-tool accent" onClick={genFollowup} disabled={fuLoad}>{fuLoad ? "作成中…" : "✉ フォローアップ文面"}</button></div></>)}
              </>)}

              {tab === "proof" && (<>
                <button className="ma-btn" onClick={proofread} disabled={corrLoad}>{corrLoad ? <><span className="ma-spin" /> 校正中…</> : "▷ 全文をソース基準で校正"}</button>
                {!corrected && !corrLoad && <p className="ma-empty" style={{ padding: "6px 2px" }}>文字起こし全文を、登録したソース・用語に基づいて校正します。音声認識の誤変換や用語の表記ゆれを直した結果を、<strong>原文は残したまま</strong>ここに別表示します。</p>}
                {corrected && (<><div style={{ whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.7 }}>{corrected}</div><div className="ma-foottools" style={{ marginTop: 14 }}><button className="ma-tool" onClick={() => copy(corrected)}>コピー</button><button className="ma-tool" onClick={() => download(corrected, "txt")}>.txt 保存</button></div></>)}
              </>)}

              {tab === "translate" && (<>
                <div className="ma-row">
                  <select className="ma-sel" style={{ flex: 1 }} value={target} onChange={(e) => setTarget(e.target.value)}>{TRANSLATE_TO.map((t) => <option key={t} value={t}>{t}</option>)}</select>
                  <button className="ma-btn" style={{ margin: 0, width: "auto", padding: "12px 18px" }} onClick={translate} disabled={transLoad}>{transLoad ? <span className="ma-spin" /> : "翻訳"}</button>
                </div>
                {!trans && !transLoad && <p className="ma-empty" style={{ padding: "6px 2px" }}>文字起こし全体を選んだ言語に翻訳します（タイムスタンプ・話者は保持）。</p>}
                {trans && (<><div style={{ whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.7 }}>{trans}</div><div className="ma-foottools" style={{ marginTop: 14 }}><button className="ma-tool" onClick={() => copy(trans)}>コピー</button><button className="ma-tool" onClick={() => download(trans, "txt")}>.txt 保存</button></div></>)}
              </>)}
              </div>
            </div>
          </div>
        </div>

        <p className="ma-foot">
          ※ 自動話者分離はブラウザ内で声の高さ・スペクトル特徴を抽出し、発言ごとにクラスタリングする<strong>近似手法</strong>です。声質が似た同性の話者などは取り違えることがあります。感度スライダーや「人数を指定して再分離」で調整してください。<br />
          ※ 文字起こし(Web Speech API)と声の解析(Web Audio API)で同時にマイクを使います。<br />
          ※ 高精度な話者分離が必要な場合は、Whisper系の文字起こし＋専用ダイアライゼーション(AssemblyAI / Deepgram / pyannote 等)への置き換えが有効です（要APIキー・バックエンド）。
        </p>
      </div>

      {showSlack && (
        <SlackPanel base={slackUrl} onChangeBase={(v) => setSlackUrl(v)} onBack={() => setShowSlack(false)} />
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<MeetingAssistant />);
</script>
</body>
</html>
