<script type="module">
  import { pipeline, env } from "https://esm.sh/@huggingface/transformers@3";
  env.allowLocalModels = false;
  let transcriber = null, loadedModel = null;
  window.MeetingSTT = {
    async load(progress, modelId) {
      modelId = modelId || "onnx-community/whisper-base";
      if (transcriber && loadedModel === modelId) return;
      transcriber = null; loadedModel = null;
      let device = "wasm";
      try { if (navigator.gpu) device = "webgpu"; } catch (e) {}
      try {
        transcriber = await pipeline("automatic-speech-recognition", modelId, { device, progress_callback: progress });
      } catch (e) {
        transcriber = await pipeline("automatic-speech-recognition", modelId, { device: "wasm", progress_callback: progress });
      }
      loadedModel = modelId;
    },
    async transcribe(float32_16k, language) {
      if (!transcriber) throw new Error("model not loaded");
      const out = await transcriber(float32_16k, { chunk_length_s: 30, language: language || "japanese", task: "transcribe" });
      return (out && out.text ? out.text : "").trim();
    }
  };

//  会議リアルタイムアシスタント v3（自動話者分離つき）
//  文字起こし: Web Speech API
//  話者分離: Web Audio API で声の特徴を抽出→オンライン・クラスタリング（ブラウザ内）
//  要約・議事録・翻訳: Claude API
//  ※ 話者分離は声の高さ・スペクトル特徴によるヒューリスティック近似です
// ─────────────────────────────────────────────────────────────

const C = {
  paper: "#f4f1ea", paper2: "#ebe6db", ink: "#1f1b16", inkSoft: "#5c554b",

const LANGS = [

  { code: "zh-CN", label: "中文", whisper: "chinese" }, { code: "ko-KR", label: "한국어", whisper: "korean" },

// ===== 音声特徴 & クラスタリング（純関数） =====
function autoCorrelate(buf, sr) {
  const size = buf.length;
  let rms = 0;
  for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / size);
  if (rms < 0.008) return -1;
  let r1 = 0, r2 = size - 1;
  const thr = 0.2;
  for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thr) { r1 = i; break; }
  for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thr) { r2 = size - i; break; }
  const b = buf.slice(r1, r2);
  const n = b.length;
  if (n < 64) return -1;
  const c = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) c[i] += b[j] * b[j + i];
  let d = 0;
  while (d < n - 1 && c[d] > c[d + 1]) d++;
  let maxv = -1, T0 = -1;
  for (let i = d; i < n; i++) if (c[i] > maxv) { maxv = c[i]; T0 = i; }
  if (T0 <= 0) return -1;
  const x1 = c[T0 - 1] || 0, x2 = c[T0], x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  if (a) T0 = T0 - bb / (2 * a);
  const freq = sr / T0;
  return (freq < 70 || freq > 500) ? -1 : freq;
}
// 1フレームの正規化特徴ベクトル（声がある時のみ返す）
function frameFeature(td, fd, sr, fftSize) {
  const pitch = autoCorrelate(td, sr);
  if (pitch < 0) return null; // 無声フレームは捨てる（簡易VAD）
  const bins = fd.length;
  let sum = 0, wsum = 0, low = 0, mid = 0, high = 0;
  for (let i = 1; i < bins; i++) {
    const lin = Math.pow(10, fd[i] / 20);
    const f = (i * sr) / fftSize;
    sum += lin; wsum += f * lin;
    if (f < 500) low += lin; else if (f < 2000) mid += lin; else if (f < 6000) high += lin;
  }
  const centroid = sum > 0 ? wsum / sum : 0;
  const e = low + mid + high + 1e-9;
  return [pitch / 300, centroid / 4000, low / e, mid / e, high / e];
}
function meanVec(arr) {
  const dim = arr[0].length, out = new Array(dim).fill(0);
  arr.forEach((v) => v.forEach((x, i) => (out[i] += x)));
  return out.map((x) => x / arr.length);
}
const dist = (a, b) => Math.sqrt(a.reduce((s, x, i) => s + (x - b[i]) ** 2, 0));
function kmeans(vecs, k, iters = 14) {
  const n = vecs.length, dim = vecs[0].length;
  let cents = [vecs[Math.floor(Math.random() * n)].slice()];
  while (cents.length < k) {
    const d2 = vecs.map((v) => Math.min(...cents.map((c) => dist(v, c) ** 2)));
    let sum = d2.reduce((a, b) => a + b, 0) || 1, r = Math.random() * sum, idx = 0;
    for (let i = 0; i < n; i++) { r -= d2[i]; if (r <= 0) { idx = i; break; } }
    cents.push(vecs[idx].slice());
  }
  let assign = new Array(n).fill(0);
  for (let it = 0; it < iters; it++) {
    for (let i = 0; i < n; i++) {
      let bd = Infinity, bj = 0;
      for (let j = 0; j < k; j++) { const d = dist(vecs[i], cents[j]); if (d < bd) { bd = d; bj = j; } }
      assign[i] = bj;
    }
    const sums = Array.from({ length: k }, () => new Array(dim).fill(0)), cnt = new Array(k).fill(0);
    for (let i = 0; i < n; i++) { cnt[assign[i]]++; for (let d = 0; d < dim; d++) sums[assign[i]][d] += vecs[i][d]; }
    for (let j = 0; j < k; j++) if (cnt[j]) cents[j] = sums[j].map((x) => x / cnt[j]);
  }
  return { assign };
}

const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const escHtml = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const spkName = (i) => "話者" + String.fromCharCode(65 + i); // 話者A,B,C…

// Zoom等の文字起こしを取り込む（WEBVTT / SRT / プレーンテキストに対応）。[{t, speaker, text}] を返す。
function parseTranscript(raw) {
  const txt = (raw || "").replace(/\r/g, "");
  const out = [];
  const hms = (h, m, s) => `${String((+h) * 60 + (+m)).padStart(2, "0")}:${String(+s).padStart(2, "0")}`;
  if (/-->/.test(txt)) {
    // WEBVTT / SRT 形式（Zoomのクラウド音声トランスクリプト等）
    const lines = txt.split("\n");
    let t = "";
    const tsRe = /(\d{1,2}):(\d{2}):(\d{2})[.,]\d+\s*-->/;
    for (const line of lines) {
      const m = line.match(tsRe);
      if (m) { t = hms(m[1], m[2], m[3]); continue; }
      const s = line.trim();
      if (!s || /^WEBVTT/i.test(s) || /^NOTE/i.test(s) || /^\d+$/.test(s)) continue;
      let speaker = "", text = s;
      const v = s.match(/^<v\s+([^>]+)>([\s\S]*?)(?:<\/v>)?$/i);
      if (v) { speaker = v[1].trim(); text = v[2].trim(); }
      else { const c = s.match(/^([^:：]{1,40})[:：]\s*(.+)$/); if (c) { speaker = c[1].trim(); text = c[2].trim(); } }
      text = text.replace(/<[^>]+>/g, "").trim();
      if (text) out.push({ t, speaker, text });
    }
  } else {
    // プレーンテキスト（"話者名 HH:MM:SS" 見出し＋本文、空行区切り、または "話者名: 本文"）
    const headRe = /^(.+?)\s+(\d{1,2}:\d{2}(?::\d{2})?)\s*$/;
    for (const b of txt.split(/\n\s*\n/)) {
      const bl = b.split("\n").map((x) => x.trim()).filter(Boolean);
      if (!bl.length) continue;
      let speaker = "", t = "", start = 0;
      const h = bl[0].match(headRe);
      if (h) {
        speaker = h[1].trim();
        const p = h[2].split(":").map(Number);
        t = p.length === 3 ? hms(p[0], p[1], p[2]) : `${String(p[0]).padStart(2, "0")}:${String(p[1]).padStart(2, "0")}`;
        start = 1;
      }
      let body = bl.slice(start).join(" ").trim();
      if (!speaker) { const c = body.match(/^([^:：]{1,40})[:：]\s*(.+)$/); if (c) { speaker = c[1].trim(); body = c[2].trim(); } }
      if (body) out.push({ t, speaker, text: body });
    }
  }
  return out;
}

// ブラウザに恒久保存（localStorage）。サンドボックス等で使えない場合は安全に無効化。

const loadOnboarded = () => { try { return window.localStorage.getItem(GUIDE_KEY) === "1"; } catch (e) { return false; } };
const saveOnboarded = () => { try { window.localStorage.setItem(GUIDE_KEY, "1"); } catch (e) {} };
const loadGSrc = () => { try { const r = window.localStorage.getItem(GSRC_KEY); return r ? JSON.parse(r) : []; } catch (e) { return []; } };
const saveGSrc = (o) => { try { window.localStorage.setItem(GSRC_KEY, JSON.stringify(o)); } catch (e) {} };
const loadMSrcMap = () => { try { const r = window.localStorage.getItem(MSRC_KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } };
const loadMSrc = (id) => { const m = loadMSrcMap(); return Array.isArray(m[id]) ? m[id] : []; };
const saveMSrc = (id, arr) => { try { const m = loadMSrcMap(); if (arr && arr.length) m[id] = arr; else delete m[id]; window.localStorage.setItem(MSRC_KEY, JSON.stringify(m)); } catch (e) {} };

// Claude API 呼び出し。
//  - proxyあり: 自分のバックエンド（Cloudflare Workers等）経由でキーを隠して呼ぶ（推奨・配布向け）
//  - キーあり: ユーザー自身のAPIキーでブラウザから直接呼ぶ（ローカル個人利用 / bring-your-own-key）
//  - どちらもなし: Claude.ai のアーティファクト環境内ならキー不要で動く（フォールバック）
async function callClaude(prompt, cfg) {
  cfg = cfg || {};
  const body = { model: cfg.model || "claude-sonnet-4-6", max_tokens: 1500, messages: [{ role: "user", content: prompt }] };
  if (cfg.proxyUrl) {
    const res = await fetch(cfg.proxyUrl, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "APIエラー");
    return data.content.map((i) => (i.type === "text" ? i.text : "")).join("").trim();
  }
  if (cfg.key) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": cfg.key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "APIエラー");
    return data.content.map((i) => (i.type === "text" ? i.text : "")).join("").trim();
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "APIエラー");
  return data.content.map((i) => (i.type === "text" ? i.text : "")).join("").trim();
}

function MD({ text }) {
  const blocks = []; let list = null;
  const flush = () => { if (list) { blocks.push({ type: "ul", items: list }); list = null; } };
  text.split("\n").forEach((raw) => {
    const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { flush(); const lvl = line.match(/^#+/)[0].length; blocks.push({ type: "h", lvl, text: line.replace(/^#+\s/, "") }); }
    else if (/^[-*]\s/.test(line)) (list = list || []).push(line.replace(/^[-*]\s/, ""));
    else if (/^\d+\.\s/.test(line)) (list = list || []).push(line.replace(/^\d+\.\s/, ""));
    else if (line.trim() === "") flush();
    else { flush(); blocks.push({ type: "p", text: line }); }
  });
  flush();
  const inline = (t) => t.split(/(\*\*[^*]+\*\*)/g).map((p, i) => p.startsWith("**") && p.endsWith("**") ? <strong key={i}>{p.slice(2, -2)}</strong> : <React.Fragment key={i}>{p}</React.Fragment>);
  return <div>{blocks.map((b, i) => b.type === "h" ? <div key={i} className={b.lvl === 1 ? "md-h1" : "md-h2"}>{inline(b.text)}</div> : b.type === "ul" ? <ul key={i} className="md-ul">{b.items.map((it, j) => <li key={j}>{inline(it)}</li>)}</ul> : <p key={i} className="md-p">{inline(b.text)}</p>)}</div>;
}

  };

  // ── 書き出し（SRT / 印刷・PDF / Word）
  const tSec = (mmss) => { const p = (mmss || "0:0").split(":").map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
  const toSrtTime = (sec) => { const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60); return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")},000`; };
  const exportSRT = () => {
    const segs = segRef.current;
    if (!segs.length) { setError("書き出す文字起こしがありません。"); return; }
    const srt = segs.map((s, i) => {
      const startSec = tSec(s.t);
      const endSec = segs[i + 1] ? Math.max(tSec(segs[i + 1].t), startSec + 1) : startSec + 3;
      return `${i + 1}\n${toSrtTime(startSec)} --> ${toSrtTime(endSec)}\n${s.speaker ? s.speaker + ": " : ""}${s.text}\n`;
    }).join("\n");
    download(srt, "srt");
  };
  const printHTML = (inner) => {
    const w = window.open("", "_blank");
    if (!w) { setError("ポップアップがブロックされました。印刷・PDF出力を許可してください。"); return; }
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escHtml(title)}</title><style>body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;line-height:1.7;max-width:760px;margin:32px auto;padding:0 16px;color:#1f1b16;} h1{font-size:22px;border-bottom:2px solid #1f1b16;padding-bottom:6px;} h2{font-size:16px;color:#c8482f;margin-top:20px;} .t{color:#9a7b3f;font-variant-numeric:tabular-nums;margin-right:8px;} .seg{padding:4px 0;border-bottom:1px dashed #ddd;} .sp{font-weight:700;}</style></head><body>${inner}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`);
    w.document.close();
  };
  const printTranscript = () => printHTML(`<h1>${escHtml(title)}</h1><p>${activeDate.toLocaleDateString("ja-JP")} ・ ${segments.length}発言</p>` + segRef.current.map((s) => `<div class="seg"><span class="t">${escHtml(s.t)}</span>${s.speaker ? `<span class="sp">${escHtml(s.speaker)}: </span>` : ""}${escHtml(s.text)}</div>`).join(""));
  const mdToHtml = (md) => md.split("\n").map((l) => { if (/^# /.test(l)) return `<h1>${escHtml(l.slice(2))}</h1>`; if (/^## /.test(l)) return `<h2>${escHtml(l.slice(3))}</h2>`; if (/^[-*] /.test(l)) return `<li>${escHtml(l.slice(2))}</li>`; return l.trim() ? `<p>${escHtml(l)}</p>` : ""; }).join("");
  const printMinutes = () => { if (!minutes) { setError("先に整形議事録を生成してください。"); return; } printHTML(mdToHtml(minutes)); };

  };

  const analyze = useCallback(async () => {
    const full = buildText();

    const prior = analysisRef.current ? `\n# これまでの分析（引き継いで更新する）\n${JSON.stringify(analysisRef.current)}\n` : "";
    const prompt = `あなたは優秀な会議ファシリテーター兼アシスタントです。「これまでの分析」を土台に「直近の文字起こし」を加味して内容を更新し、必ず下記JSON形式のみで出力（前置き・コードフェンス禁止）。決定事項・アクションは累積し、重複は統合してください。
{"summary":["要点を3〜6個"],"decisions":["決まったこと。なければ []"],"actions":[{"task":"やるべきこと","owner":"担当者（話者名等。なければ空文字）"}],"advice":["進行アドバイスや次に確認すべき質問を2〜4個"],"topics":["主要トピックの短いタグ数個"]}${vocabBlock()}${sourceBlock()}${prior}

"""${recent}"""`;

    catch (e) { setError("分析に失敗しました: " + (e.message || "") + ((apiCfgRef.current.key || apiCfgRef.current.proxyUrl) ? "" : "（AI接続が未設定の可能性。右上の ⚙ から設定してください）")); } finally { setAnalyzing(false); }
  }, []);

  const TMPL = { 汎用: "標準的な議事録として整理。", 商談: "商談メモとして、相手のニーズ・課題・予算/時期・懸念・ネクストアクションを重視。", "1on1": "1on1として、テーマ・相手の状況や悩み・合意事項・フォロー事項を重視。", 朝会: "デイリー/朝会として、各自の進捗・本日やること・ブロッカーを簡潔に。", ブレスト: "ブレストとして、出たアイデア・賛否・保留/採用・次に検討する点を整理。", 面接: "採用面接として、候補者の経歴・強み/懸念・評価ポイント・次選考の判断材料を整理。" };
  const LEN = { 短: "要点中心に簡潔に（短め）", 標準: "標準的な詳しさで", 詳細: "経緯や背景も含めて詳細に" };

  const notesBlock = () => { const n = (myNotes || "").trim(); return n ? `\n# ユーザー自身のメモ（最優先の骨子）\n以下はユーザーが会議中に取ったメモです。これを議事録の骨子として最優先で活かし、不足や曖昧な点だけを文字起こしで補完してください（メモの意図は変えない）。\n"""${n}"""\n` : ""; };

方針: ${TMPL[minTemplate]} 文体は${TONE[minTone]}、分量は${LEN[minLength]}まとめる。話者ラベルを活用し、誰が何を述べ・誰がどのタスクを持つかを明確に。該当なしの項目は「特になし」。出力はMarkdownのみ。
推奨構成（会議の性質に合わせ見出しは調整可）:
# ${title}

# 文字起こし
"""${text}"""`;
    try { setMinutes(await callClaude(prompt, apiCfgRef.current)); } catch (e) { setError("議事録の生成に失敗しました: " + (e.message || "") + ((apiCfgRef.current.key || apiCfgRef.current.proxyUrl) ? "" : "（AI接続が未設定の可能性。右上の ⚙ から設定してください）")); } finally { setMinLoad(false); }

  };

  const chars = segments.reduce((n, s) => n + s.text.length, 0);

  return (

                <div className="ma-foottools" style={{ marginTop: 12 }}><button className="ma-tool accent" onClick={() => copy(followup)}>コピー</button><button className="ma-tool" onClick={() => download(followup, "txt")}>.txt 保存</button><button className="ma-tool" onClick={() => setShowFollowup(false)}>閉じる</button></div></>}
          </div>

                    </div>
                  </div>
                )}
              </div>

              {/* 話者チップ（手動補正・命名） */}
              <div className="ma-spkbar">
                <span className="lab" title="チップをダブルクリックで名前を変更できます">話者:</span>
                {speakers.map((s) => (
                  editSpk === s
                    ? <input key={s} className="ma-spkadd" autoFocus defaultValue={s} onBlur={(e) => renameSpeaker(s, e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); else if (e.key === "Escape") setEditSpk(null); }} style={{ borderColor: spkColor(s), width: 90 }} />
                    : <button key={s} className={`ma-chip${curSpeaker === s ? " on" : ""}`} onClick={() => pickSpeaker(s)} onDoubleClick={() => setEditSpk(s)} title="クリックで選択／ダブルクリックで名前を変更" style={{ borderColor: spkColor(s), color: curSpeaker === s ? "#fff" : spkColor(s), background: curSpeaker === s ? spkColor(s) : "transparent" }}>{s}</button>
                ))}
                <input className="ma-spkadd" value={newSpeaker} placeholder="＋ 追加" onChange={(e) => setNewSpeaker(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSpeaker()} />
              </div>

              <div className="ma-tools">
                <input className="ma-search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="🔍 文字起こし内を検索" />
                <label className="ma-toggle"><input type="checkbox" checked={onlyHl} onChange={(e) => setOnlyHl(e.target.checked)} /> 重要のみ</label>
                <label className="ma-toggle"><input type="checkbox" checked={liveTranslate} onChange={(e) => setLiveTranslate(e.target.checked)} /> リアルタイム翻訳</label>
                {liveTranslate && <select className="ma-sel" style={{ padding: "5px 7px", fontSize: 12 }} value={target} onChange={(e) => setTarget(e.target.value)}>{TRANSLATE_TO.map((t) => <option key={t} value={t}>{t}</option>)}</select>}
              </div>

              <div className="ma-transcript" ref={scrollRef} onScroll={onTranscriptScroll}>
                {segments.length === 0 && !interim && (
                  <p className="ma-empty">「録音」でマイクからの文字起こしと自動話者分離が始まります（発言ごとに話者A/B/C…を推定して色分け、誤りは手動修正や「人数を指定して再分離」で補正可）。<br /><br />Web会議の相手の声を文字起こしするには上部の「会議音声」を押し、共有ダイアログで会議の<strong>タブ</strong>を選んで<strong>「タブの音声を共有」をオン</strong>にしてください（PCのChrome/Edge専用）。文字起こしはブラウザ内（あなたのPC）で行われ、クラウドには送られません。</p>
                )}
                {shown.map((s) => (
                  <div key={s.id} className={`ma-seg${s.hl ? " hl" : ""}`}>
                    <span className="ma-ts">{s.t}</span>
                    <div className="ma-segmain">
                      {(speakers.length > 0 || s.speaker) && (
                        <select className="ma-spklab" value={s.speaker || ""} onChange={(e) => setSegSpeaker(s.id, e.target.value)} style={{ color: spkColor(s.speaker) }}>
                          <option value="">（話者なし）</option>
                          {speakers.map((sp) => <option key={sp} value={sp}>{sp}</option>)}
                        </select>
                      )}
                      {editId === s.id
                        ? <textarea className="ma-edit" rows={2} autoFocus value={editVal} onChange={(e) => setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); } }} />
                        : <div className="ma-segtext" onClick={() => startEdit(s)}>{hl(s.text)}</div>}
                      {s.tr && <div className="ma-tr">{s.tr}</div>}
                    </div>
                    <div className="ma-act">
                      <button className="ma-ibtn" onClick={() => addTask(s.text)} title="自分のタスクに追加">＋✓</button>
                      <button className={`ma-ibtn star${s.hl ? " on" : ""}`} onClick={() => toggleHl(s.id)} title="重要マーク">★</button>
                      <button className="ma-ibtn" onClick={() => delSeg(s.id)} title="削除">✕</button>
                    </div>
                  </div>
                ))}
                {interim && <div className="ma-interim">{interim}…</div>}
                {!atBottom && segments.length > 4 && <button className="ma-jump" onClick={scrollToBottom}>↓ 最新の発言へ</button>}
              </div>

              {segments.length > 0 && (
                <div className="ma-foottools"><button className="ma-tool" onClick={() => copy(buildText())}>コピー</button><button className="ma-tool" onClick={() => download(buildText(), "txt")}>.txt</button><button className="ma-tool" onClick={exportSRT}>.srt</button><button className="ma-tool" onClick={printTranscript}>印刷/PDF</button></div>
              )}
            </div>
          </div>

          <div className="ma-r">
            <div className="ma-card">
              <div className="ma-tabs">{[["ai", "要約・アドバイス"], ["memo", "メモ"], ["minutes", "整形議事録"], ["proof", "校正"], ["translate", "翻訳"]].map(([k, v]) => <button key={k} className={`ma-tab${tab === k ? " on" : ""}`} onClick={() => setTab(k)}>{v}</button>)}</div>
              {(() => { const sc = [...gSources, ...mSources].filter((x) => x.on).length; const vc = (vocab || "").split("\n").filter((l) => l.trim()).length; return (sc > 0 || vc > 0) ? <div className="ma-grounding" onClick={() => setShowSources(true)} title="クリックでソースを確認"><IC.book s={13} /> AIが参照中：{sc > 0 ? `ソース${sc}件` : ""}{sc > 0 && vc > 0 ? "・" : ""}{vc > 0 ? `用語${vc}件` : ""}</div> : null; })()}
              {!apiKey && !proxyUrl && <div className="ma-warn">AI機能（要約・議事録・翻訳・自動命名）には接続設定が必要です。右上の ⚙ から「プロキシURL」または「APIキー」を設定してください。（Claude.ai アプリ内では不要）</div>}
              <div className="ma-rbody">

              {tab === "ai" && (<>
                <button className="ma-btn" onClick={analyze} disabled={analyzing}>{analyzing ? <><span className="ma-spin" /> 分析中…</> : "▷ AIで要約・アドバイスを生成"}</button>
                <label className="ma-auto"><input type="checkbox" checked={auto} onChange={(e) => setAuto(e.target.checked)} /> 録音・取込中は約2分ごとに自動更新</label>
                {!analysis && !analyzing && <p className="ma-empty" style={{ padding: "6px 2px" }}>会話がたまったらボタンを押すと、要点・決定事項・アクション・進行アドバイスを整理します。</p>}
                {(analyzedAt || analyzing) && <div className="ma-mini" style={{ marginBottom: 6 }}>{analyzing ? "更新中…" : `最終更新 ${new Date(analyzedAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}`}</div>}
                {analysis && (<div className="ma-aigrid">
                  <Sec title="要約" mini="SUMMARY"><ul className="ma-list">{(analysis.summary || []).map((x, i) => <li key={i}>{x}</li>)}</ul></Sec>
                  {(analysis.decisions || []).length > 0 && <Sec title="決定事項" mini="DECISIONS"><ul className="ma-list">{analysis.decisions.map((x, i) => <li key={i}>{x}</li>)}</ul></Sec>}
                  {(analysis.actions || []).length > 0 && <Sec title="アクションアイテム" mini="TO-DO">{analysis.actions.map((a, i) => <div className="ma-action" key={i}><span className="t">{a.task}</span>{a.owner ? <span className="ma-owner">{a.owner}</span> : null}<button className="ma-addtask" title="マイタスクに追加" onClick={() => addTask(a.owner ? `${a.task}（${a.owner}）` : a.task)}>＋</button></div>)}</Sec>}
                  {(analysis.advice || []).length > 0 && <Sec title="アドバイス" mini="ADVICE"><ul className="ma-list ma-advice">{analysis.advice.map((x, i) => <li key={i}>{x}</li>)}</ul></Sec>}
                  {(analysis.topics || []).length > 0 && <Sec title="トピック" mini="TAGS"><div className="ma-tags">{analysis.topics.map((x, i) => <span className="ma-tag" key={i}>#{x}</span>)}</div></Sec>}
                </div>)}
              </>)}

              {tab === "memo" && (<>
                <p className="ma-empty" style={{ padding: "2px 2px 8px" }}>会議中に要点や気づきをメモしておくと、議事録の生成時にAIが<strong>このメモを骨子</strong>として整形し、抜けを文字起こしで補完します（Granola方式）。</p>
                <textarea className="ma-memo" value={myNotes} onChange={(e) => setMyNotes(e.target.value)} placeholder={"例）\n・予算は来期で確定、上限300万\n・田中さんが先方に見積り依頼（今週中）\n・次回は要件定義のレビュー"} />
                <div className="ma-mini" style={{ marginTop: 8 }}>{myNotes.trim() ? `${myNotes.trim().length} 文字 ・ 議事録に反映されます` : "自動保存されます"}</div>
              </>)}

              {tab === "minutes" && (<>
                <div className="ma-optrow">
                  <label>形式<select value={minTemplate} onChange={(e) => setMinTemplate(e.target.value)}>{["汎用", "商談", "1on1", "朝会", "ブレスト", "面接"].map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
                  <label>長さ<select value={minLength} onChange={(e) => setMinLength(e.target.value)}>{["短", "標準", "詳細"].map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
                  <label>トーン<select value={minTone} onChange={(e) => setMinTone(e.target.value)}>{["ビジネス", "カジュアル", "テック"].map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
                </div>
                <button className="ma-btn" onClick={genMinutes} disabled={minLoad}>{minLoad ? <><span className="ma-spin" /> 作成中…</> : "▷ 整形された議事録を生成"}</button>
                {myNotes.trim() && <div className="ma-mini" style={{ margin: "-6px 0 8px" }}>あなたのメモを骨子に反映します</div>}
                {!minutes && !minLoad && <p className="ma-empty" style={{ padding: "6px 2px" }}>出席者・議題・決定事項・アクションを構造化した、そのまま提出できる議事録を作成します。</p>}
                {minutes && (<><MD text={minutes} /><div className="ma-foottools" style={{ marginTop: 14 }}><button className="ma-tool" onClick={() => copy(minutes)}>コピー</button><button className="ma-tool" onClick={() => download(minutes, "md")}>.md</button><button className="ma-tool" onClick={() => downloadDoc(minutes)}>Word(.doc)</button><button className="ma-tool" onClick={printMinutes}>印刷/PDF</button><button className="ma-tool accent" onClick={genFollowup} disabled={fuLoad}>{fuLoad ? "作成中…" : "✉ フォローアップ文面"}</button></div></>)}
              </>)}

              {tab === "proof" && (<>
                <button className="ma-btn" onClick={proofread} disabled={corrLoad}>{corrLoad ? <><span className="ma-spin" /> 校正中…</> : "▷ 全文をソース基準で校正"}</button>
                {!corrected && !corrLoad && <p className="ma-empty" style={{ padding: "6px 2px" }}>文字起こし全文を、登録したソース・用語に基づいて校正します。音声認識の誤変換や用語の表記ゆれを直した結果を、<strong>原文は残したまま</strong>ここに別表示します。</p>}
                {corrected && (<><div style={{ whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.7 }}>{corrected}</div><div className="ma-foottools" style={{ marginTop: 14 }}><button className="ma-tool" onClick={() => copy(corrected)}>コピー</button><button className="ma-tool" onClick={() => download(corrected, "txt")}>.txt 保存</button></div></>)}
              </>)}

              {tab === "translate" && (<>
                <div className="ma-row">
                  <select className="ma-sel" style={{ flex: 1 }} value={target} onChange={(e) => setTarget(e.target.value)}>{TRANSLATE_TO.map((t) => <option key={t} value={t}>{t}</option>)}</select>
                  <button className="ma-btn" style={{ margin: 0, width: "auto", padding: "12px 18px" }} onClick={translate} disabled={transLoad}>{transLoad ? <span className="ma-spin" /> : "翻訳"}</button>
                </div>
                {!trans && !transLoad && <p className="ma-empty" style={{ padding: "6px 2px" }}>文字起こし全体を選んだ言語に翻訳します（タイムスタンプ・話者は保持）。</p>}
                {trans && (<><div style={{ whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.7 }}>{trans}</div><div className="ma-foottools" style={{ marginTop: 14 }}><button className="ma-tool" onClick={() => copy(trans)}>コピー</button><button className="ma-tool" onClick={() => download(trans, "txt")}>.txt 保存</button></div></>)}
              </>)}
              </div>
            </div>
          </div>
        </div>

        <p className="ma-foot">
          ※ 自動話者分離はブラウザ内で声の高さ・スペクトル特徴を抽出し、発言ごとにクラスタリングする<strong>近似手法</strong>です。声質が似た同性の話者などは取り違えることがあります。感度スライダーや「人数を指定して再分離」で調整してください。<br />
          ※ 文字起こし(Web Speech API)と声の解析(Web Audio API)で同時にマイクを使います。<br />
          ※ 高精度な話者分離が必要な場合は、Whisper系の文字起こし＋専用ダイアライゼーション(AssemblyAI / Deepgram / pyannote 等)への置き換えが有効です（要APIキー・バックエンド）。
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<MeetingAssistant />);
</script>
</body>
</html>
